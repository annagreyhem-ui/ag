/* =====================================================
   Anna Greyhem — shared site styles
   ===================================================== */

:root {
  --bg:         #0a0a0a;
  --text:       rgba(255, 255, 255, 0.85);
  --text-muted: rgba(255, 255, 255, 0.35);
  --text-soft:  rgba(255, 255, 255, 0.55);
  --text-faint: rgba(255, 255, 255, 0.18);
  --hairline:   rgba(255, 255, 255, 0.10);
  --ease:       cubic-bezier(.22, .61, .36, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 400;
  font-size: clamp(20px, 2.6vw, 22px);
  line-height: 1.9;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* soft vignette */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  z-index: 1;
}

/* ===================== MENU ICON ===================== */
.menu-icon {
  position: fixed;
  top: clamp(22px, 3vw, 36px);
  left: clamp(22px, 3vw, 36px);
  width: 28px;
  height: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  z-index: 50;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  color: inherit;
  font: inherit;
  outline: none;
  transition: transform .6s var(--ease);
}
.menu-icon:focus-visible {
  outline: 1px solid var(--text-faint);
  outline-offset: 8px;
}
.menu-icon span {
  display: block;
  width: 100%;
  height: 1px;
  background: var(--text-soft);
  transition: transform .55s var(--ease), opacity .35s var(--ease), background .35s var(--ease);
  transform-origin: center;
}
.menu-icon:hover span { background: var(--text); }
.menu-icon.is-open span:nth-child(1) { transform: translateY(10.5px) rotate(45deg); }
.menu-icon.is-open span:nth-child(2) { opacity: 0; }
.menu-icon.is-open span:nth-child(3) { transform: translateY(-10.5px) rotate(-45deg); }

/* ===================== WORDMARK ===================== */
/* The single, consistent way to render "Anna Greyhem" wherever it
   appears. Only font-size changes by context. */
.wordmark {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  font-style: normal;
  letter-spacing: 0.06em;
  text-decoration: none;
  text-transform: none;
  color: inherit;
  white-space: nowrap;
}

/* ===================== STICKY HEADER ===================== */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: clamp(64px, 8vh, 88px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
  z-index: 40;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.65) 70%, rgba(10,10,10,0) 100%);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.site-header a.header-name {
  pointer-events: auto;
  text-decoration: none;
}
.header-name {
  font-size: clamp(14px, 1.4vw, 17px);
  color: var(--text-soft);
  transition: color .4s var(--ease);
}
.site-header a.header-name:hover { color: var(--text); }

/* ===================== MENU OVERLAY ===================== */
.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 45;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: clamp(64px, 9vw, 140px);
  padding-right: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .7s var(--ease);
}
.menu-overlay.is-open {
  opacity: 1;
  pointer-events: auto;
}
.menu-nav {
  display: flex;
  flex-direction: column;
  gap: clamp(18px, 2.6vh, 28px);
  text-align: left;
  align-items: flex-start;
}
.menu-nav a {
  position: relative;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(40px, 7vw, 80px);
  color: var(--text-soft);
  text-decoration: none;
  letter-spacing: 0.01em;
  line-height: 1.15;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .8s var(--ease), transform .8s var(--ease), color .4s var(--ease);
}
.menu-nav a::before {
  content: "";
  position: absolute;
  left: -28px;
  top: 50%;
  width: 14px;
  height: 1px;
  background: var(--text-soft);
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity .4s var(--ease), transform .4s var(--ease);
}
.menu-nav a:hover { color: var(--text); }
.menu-nav a:hover::before { opacity: 1; transform: translateX(0); }
.menu-overlay.is-open .menu-nav a {
  opacity: 1;
  transform: none;
}
.menu-overlay.is-open .menu-nav a:nth-child(1) { transition-delay: .15s; }
.menu-overlay.is-open .menu-nav a:nth-child(2) { transition-delay: .25s; }
.menu-overlay.is-open .menu-nav a:nth-child(3) { transition-delay: .35s; }
.menu-overlay.is-open .menu-nav a:nth-child(4) { transition-delay: .45s; }
.menu-overlay.is-open .menu-nav a:nth-child(5) { transition-delay: .55s; }

.menu-footer {
  position: absolute;
  bottom: clamp(28px, 4vh, 44px);
  left: clamp(64px, 9vw, 140px);
  right: 24px;
  text-align: left;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  opacity: 0;
  transition: opacity 1s var(--ease) .7s;
}
.menu-overlay.is-open .menu-footer { opacity: 1; }

body.menu-locked { overflow: hidden; }

/* ===================== MAIN ===================== */
main {
  position: relative;
  z-index: 5;
  flex: 1;
  padding-top: clamp(64px, 8vh, 88px);
}

/* ===================== INNER PAGE LAYOUT ===================== */
.page {
  max-width: 760px;
  margin: 0 auto;
  padding: clamp(60px, 10vh, 120px) clamp(28px, 6vw, 80px) clamp(80px, 12vh, 140px);
}
.page-eyebrow {
  font-size: 13px;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  margin-bottom: clamp(24px, 4vh, 36px);
}
.page-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  font-style: normal;
  font-size: clamp(44px, 7vw, 84px);
  line-height: 1.05;
  letter-spacing: 0.01em;
  margin: 0 0 clamp(40px, 7vh, 72px);
  color: var(--text);
}
.page-divider {
  width: 60px;
  height: 1px;
  background: var(--text-faint);
  margin: 0 0 clamp(40px, 6vh, 56px);
}
.page h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 500;
  font-style: normal;
  font-size: clamp(20px, 1.8vw, 24px);
  letter-spacing: 0.02em;
  color: var(--text);
  margin: clamp(40px, 6vh, 64px) 0 clamp(12px, 2vh, 18px);
}
.page h2:first-of-type { margin-top: 0; }
.page p {
  margin: 0 0 1.2em;
  color: var(--text);
  font-size: clamp(18px, 1.6vw, 20px);
  line-height: 1.85;
}
.page p.lead {
  font-style: normal;
  font-weight: 400;
  font-size: clamp(22px, 2.2vw, 28px);
  color: var(--text);
  line-height: 1.6;
  margin-bottom: clamp(32px, 5vh, 48px);
}
.page a {
  color: var(--text);
  text-decoration: none;
  border-bottom: 1px solid var(--text-faint);
  transition: border-color .4s var(--ease), color .4s var(--ease);
}
.page a:hover {
  border-bottom-color: var(--text-soft);
}
.page address {
  font-style: normal;
  color: var(--text);
  font-size: clamp(18px, 1.6vw, 20px);
  line-height: 1.85;
}

/* ===================== FOOTER ===================== */
footer {
  position: relative;
  z-index: 5;
  padding: clamp(36px, 5vh, 56px) clamp(24px, 6vw, 80px) clamp(28px, 4vh, 40px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  font-size: 13px;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  border-top: 1px solid var(--hairline);
  margin-top: auto;
}
footer a, .footer-link {
  color: var(--text-faint);
  text-decoration: none;
  transition: color .4s var(--ease);
}
footer a:hover, .footer-link:hover { color: var(--text-soft); }

/* ===================== MOBILE ===================== */
@media (max-width: 720px) {
  body { font-size: 20px; line-height: 1.85; }

  .menu-icon {
    width: 26px;
    height: 20px;
    top: 22px;
    left: 22px;
  }
  .menu-icon.is-open span:nth-child(1) { transform: translateY(9.5px) rotate(45deg); }
  .menu-icon.is-open span:nth-child(3) { transform: translateY(-9.5px) rotate(-45deg); }

  .site-header { height: 60px; }
  .header-name { font-size: 12px; letter-spacing: 0.06em; }

  .menu-overlay {
    padding-left: 32px;
    padding-right: 24px;
    align-items: center;
  }
  .menu-nav {
    gap: 26px;
  }
  .menu-nav a {
    font-size: 44px;
    line-height: 1.1;
  }
  .menu-nav a::before { display: none; }
  .menu-footer { left: 32px; right: 24px; bottom: 28px; font-size: 10px; letter-spacing: 0.36em; }

  main { padding-top: 60px; }

  .page { padding: 48px 24px 80px; }
  .page-title { font-size: 38px; }
  .page p { font-size: 18px; }
  .page p.lead { font-size: 22px; }

  footer {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 22px 18px 22px;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  footer .footer-link { white-space: nowrap; }
}

@media (hover: none) {
  .menu-nav a:active { color: var(--text); }
}

@supports (padding: max(0px)) {
  .menu-icon {
    top: max(22px, env(safe-area-inset-top));
    left: max(22px, env(safe-area-inset-left));
  }
  footer {
    padding-bottom: max(28px, env(safe-area-inset-bottom));
  }
}

<style>
  /* ----- Homepage-specific ----- */

  /* On home the body should still flex but allow tall hero */
  body { display: block; min-height: 100vh; }
  main { display: flex; flex-direction: column; min-height: 100vh; padding-top: clamp(64px, 8vh, 88px); }

  /* the menu icon & site header animate in on load on home */
  .menu-icon {
    opacity: 0;
    transition: opacity 1.4s var(--ease) .2s, transform .6s var(--ease);
  }
  .menu-icon.is-visible { opacity: 1; }

  .site-header {
    opacity: 0;
    transition: opacity .9s var(--ease);
  }
  .site-header.is-visible { opacity: 1; }

  /* HERO */
  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    will-change: transform, opacity;
    transition: transform .05s linear, opacity .05s linear;
  }
  .hero-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 2.4vw, 28px);
  }
  .hero-name {
    margin: 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: clamp(48px, 8.6vw, 124px);
    letter-spacing: 0.06em;
    color: var(--text);
    line-height: 1;
    min-height: 1.2em;
    text-align: center;
    white-space: nowrap;
    /* center the visible text only — caret is positioned absolutely */
    display: flex;
    justify-content: center;
    align-items: baseline;
  }
  .hero-name-inner {
    position: relative;
    display: inline-block;
  }
  .caret {
    position: absolute;
    left: 100%;
    top: 0.05em;
    display: inline-block;
    width: 0.04em;
    height: 0.92em;
    background: var(--text-soft);
    margin-left: 0.06em;
    animation: blink 1.05s steps(1) infinite;
  }
  .caret.is-done { animation: fadeOutCaret 1.4s var(--ease) forwards; animation-delay: .9s; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes fadeOutCaret { to { opacity: 0; } }

  .hero-hint {
    margin-top: clamp(40px, 6vh, 80px);
    color: var(--text-faint);
    font-size: 12px;
    letter-spacing: 0.06em;
    opacity: 0;
    animation: fadeIn 1.6s var(--ease) 2.8s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .hero-hint .arrow {
    display: block;
    width: 1px;
    height: 22px;
    margin: 14px auto 0;
    background: var(--text-faint);
    animation: nudge 2.6s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: translateY(0); opacity: .6; }
    50%      { transform: translateY(6px); opacity: 1; }
  }

  /* On home, hero starts at scroll-top but main content follows after hero exit */
  /* When hero is gone, lock to top, no scroll back */
  body.hero-gone .hero { display: none; }
  body.hero-gone main { padding-top: clamp(64px, 8vh, 88px); }

  /* POEM */
  .poem-section {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(80px, 14vh, 160px) clamp(24px, 6vw, 80px);
  }
  .poem {
    position: relative;
    max-width: 640px;
    text-align: left;
  }
  .poem p {
    margin: 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(26px, 3.4vw, 38px);
    line-height: 1.55;
    color: var(--text);
    letter-spacing: 0.005em;
  }
  .poem .line {
    display: block;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.4s var(--ease), transform 1.4s var(--ease);
  }
  .poem.in-view .line { opacity: 1; transform: none; }
  .poem.in-view .line:nth-child(1) { transition-delay: .05s; }
  .poem.in-view .line:nth-child(2) { transition-delay: .35s; }
  .poem.in-view .line:nth-child(3) { transition-delay: .65s; }
  .poem.in-view .line:nth-child(4) { transition-delay: .95s; }
  .poem.in-view .line:nth-child(5) { transition-delay: 1.25s; }

  .poem-signature {
    margin-top: clamp(48px, 7vh, 80px);
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }

  @media (max-width: 720px) {
    .hero-name { font-size: clamp(42px, 13vw, 64px); letter-spacing: 0.06em; }
    .hero-hint { font-size: 10px; letter-spacing: 0.5em; margin-top: 56px; }
    .poem-section { padding: 80px 28px; }
    .poem p { font-size: 24px; line-height: 1.55; }
    .poem-signature { font-size: 10px; letter-spacing: 0.32em; margin-top: 40px; }
  }

<script>
/* ===================================================
   Anna Greyhem — shared menu + interactions
   =================================================== */
(() => {
  const menuIcon = document.getElementById('menuIcon');
  const overlay = document.getElementById('menuOverlay');
  if (!menuIcon || !overlay) return;

  let menuOpen = false;
  function openMenu() {
    menuOpen = true;
    overlay.classList.add('is-open');
    menuIcon.classList.add('is-open');
    document.body.classList.add('menu-locked');
    overlay.setAttribute('aria-hidden', 'false');
    menuIcon.setAttribute('aria-label', 'Close menu');
  }
  function closeMenu() {
    menuOpen = false;
    overlay.classList.remove('is-open');
    menuIcon.classList.remove('is-open');
    document.body.classList.remove('menu-locked');
    overlay.setAttribute('aria-hidden', 'true');
    menuIcon.setAttribute('aria-label', 'Open menu');
  }
  menuIcon.addEventListener('click', () => menuOpen ? closeMenu() : openMenu());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menuOpen) closeMenu(); });
  overlay.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
})();

</script>
<script>
(() => {
  const NAME = "Anna Greyhem";
  const typed = document.getElementById('typed');
  const caret = document.getElementById('caret');
  const menuIcon = document.getElementById('menuIcon');
  const hero = document.getElementById('hero');
  const header = document.getElementById('siteHeader');

  /* Typewriter — human cadence */
  let i = 0;
  function humanDelay(prevChar, nextChar) {
    let d = 80 + Math.random() * 110;
    if (Math.random() < 0.08) d += 180;
    if (nextChar === ' ') d += 120;
    if (prevChar === ' ') d += 60;
    return d;
  }
  function type() {
    if (i < NAME.length) {
      const prev = NAME[i - 1] || '';
      const next = NAME[i] || '';
      typed.textContent = NAME.slice(0, i + 1);
      i++;
      setTimeout(type, humanDelay(prev, next));
    } else {
      caret.classList.add('is-done');
      setTimeout(() => menuIcon.classList.add('is-visible'), 600);
    }
  }
  setTimeout(type, 1100);

  /* Scroll → hero exit (one-way) */
  let heroGone = false;
  function onScroll() {
    if (heroGone) return;
    const sy = window.scrollY;
    const vh = window.innerHeight;
    const progress = Math.min(Math.max(sy / vh, 0), 1);
    hero.style.transform = `translateY(${-progress * 12}vh)`;
    hero.style.opacity = String(1 - progress * 1.15);
    header.style.opacity = String(progress);
    if (progress > 0.05) header.classList.add('is-visible');
    else header.classList.remove('is-visible');
    if (progress >= 0.999) {
      heroGone = true;
      document.body.classList.add('hero-gone');
      header.classList.add('is-visible');
      header.style.opacity = '1';
      window.scrollTo(0, 0);
      menuIcon.classList.add('is-visible');
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  /* Poem reveal */
  const poem = document.getElementById('poem');
  const poemSection = document.getElementById('poemSection');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        poem.classList.add('in-view');
        io.disconnect();
      }
    });
  }, { threshold: 0.3 });
  io.observe(poemSection);
})();
</script>
