/* Preview-only safety net: some preview servers don't tokenise relative asset
   links, blocking the shared stylesheet and desk images. If tokens are missing,
   re-link/re-source them with the current auth token. In production this is a no-op. */
(function(){
  var t = (location.search.match(/[?&]t=([^&]+)/) || [])[1];
  if (!t) return;
  var base = location.href.split('/rabbit-hole/')[0] + '/';
  function fixCSS(){
    if (getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()) return;
    var l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = base + 'assets/fonts/fonts.css?t=' + t; document.head.appendChild(l);
  }
  function fixImg(img){
    img.addEventListener('error', function retry(){
      img.removeEventListener('error', retry);
      img.src = base + img.getAttribute('data-src') + '?t=' + t;
    });
  }
  document.addEventListener('DOMContentLoaded', function(){
    fixCSS();
    document.querySelectorAll('img[data-src]').forEach(fixImg);
  });
})();
</script>

var tapeAudioCtx, tapeOsc, tapeGain;
function tapeSoundStart(){
  var unlock = document.getElementById('silentUnlock');
  if (unlock) { unlock.play().catch(function(){}); }
  if (!tapeAudioCtx) tapeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (tapeAudioCtx.state === 'suspended') tapeAudioCtx.resume();
  tapeOsc = tapeAudioCtx.createOscillator();
  tapeGain = tapeAudioCtx.createGain();
  tapeOsc.type = 'sine';
  tapeOsc.frequency.value = 110;
  tapeGain.gain.value = 0.0001;
  tapeOsc.connect(tapeGain).connect(tapeAudioCtx.destination);
  tapeOsc.start();
  tapeGain.gain.linearRampToValueAtTime(0.05, tapeAudioCtx.currentTime + 0.3);
}
function tapeSoundStop(){
  if (!tapeOsc) return;
  var t = tapeAudioCtx.currentTime;
  tapeGain.gain.linearRampToValueAtTime(0.0001, t + 0.2);
  tapeOsc.stop(t + 0.25);
  tapeOsc = null;
}

function setLight(on){
  stage.classList.toggle('lit-on', on);
  hotOff.style.display = on ? 'none' : 'block';
  hotOn.style.display = on ? 'block' : 'none';
  hotPhone.style.display = on ? 'block' : 'none';
  hotPlant.style.display = on ? 'block' : 'none';
  hotManuscript.style.display = on ? 'block' : 'none';
  hotNotes.style.display = on ? 'block' : 'none';
  hotCherriesDirect.style.display = on ? 'block' : 'none';
  hotLaptop.style.display = on ? 'block' : 'none';
  hotNotebook.style.display = on ? 'block' : 'none';
  hotNewspaper.style.display = on ? 'block' : 'none';
  hotTape.style.display = on ? 'block' : 'none';
  hotPolaroids.style.display = on ? 'block' : 'none';
  if (!on) { phoneOverlay.classList.remove('show'); plantOverlay.classList.remove('show'); manuscriptOverlay.classList.remove('show'); notesOverlay.classList.remove('show'); laptopOverlay.classList.remove('show'); notebookOverlay.classList.remove('show'); notebookFrame.classList.remove('is-open'); newspaperOverlay.classList.remove('show'); tapeOverlay.classList.remove('show'); tapeFrame.classList.remove('is-playing'); tapeSoundStop(); galleryOverlay.classList.remove('show'); polaroidsOverlay.classList.remove('show'); polaroidsFrame.classList.remove('is-developed'); }
  if (on) {
    clearTimeout(hintTimer);
    clearTimeout(hintTimer2);
    clearTimeout(tapTimer);
    hint1.classList.remove('show');
    hint2.classList.remove('show');
    tapPoint.classList.remove('show');
  }
}

var laptopScreenInner = document.getElementById('laptopScreenInner');
function fitLaptopScreen(){
  var box = laptopScreenInner.parentElement.getBoundingClientRect();
  var scale = Math.min(box.width / 900, box.height / 568);
  laptopScreenInner.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitLaptopScreen);

(function () {
  var legal = document.querySelector('.qr-legal');
  if (!legal) return;
  var nearT;
  function near() {
    legal.setAttribute('data-near', 'true');
    clearTimeout(nearT);
    nearT = setTimeout(function () { legal.setAttribute('data-near', 'false'); }, 2600);
  }
  function check(y) { if (y >= window.innerHeight - 120) near(); }
  window.addEventListener('pointermove', function (e) { check(e.clientY); }, { passive: true });
  window.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches[0]) check(e.touches[0].clientY);
  }, { passive: true });
})();
