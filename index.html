<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: Autorenwebsite — Startseite

    STRUKTUR:
    - Hero: "Anna Greyhem" erscheint groß zentriert, tippt sich per Typewriter auf
      Nur beim ersten Besuch (sessionStorage). Danach direkt normaler Header.
      Beim Scrollen zum Gedicht: Hero verschwindet permanent für diese Session.
    - Menü: drei Striche oben links, klappt auf
        → The Book (/the-book/)
        → The House (/the-house/)
        → The Author (/the-author/)
    - Gedicht: erscheint sofort beim ersten Scrollen oder Klicken
    - Buchinhalt: unter dem Gedicht, Cover links, Text rechts
    - Footer: Anna Greyhem · impressum · datenschutz

    NACHT-MODUS:
    - Aktiv zwischen 2:00 und 3:00 Uhr nachts (Ortszeit des Besuchers)
    - Easter Egg: annagreyhem.com/?night=true aktiviert Nachtmodus jederzeit
    - Nachts: Typewriter-Cursor in var(--alice) Rot
    - Nachts: "bedtime story" durchgestrichen, "Bad time story" kursiv rot drüber
    - Tagsüber: normales Gedicht, weißer Cursor

    FIXES 2026:
    - Header-Übergang gleichmäßig auf Desktop und Mobile (scroll-basiert statt position-jump)
    - iOS Safe Area: schwarzer Balken reicht jetzt bis zur Statusleiste auf iPhone
    - viewport-fit=cover im meta viewport tag

    UNTERSEITEN:
    - /the-book/        — How Life Feels
    - /the-house/       — The House
    - /the-author/      — The Author
    - /impressum/       — Impressum
    - /datenschutz/     — Datenschutz

    FARBEN: --text, --alice, --text-muted, --text-faint (alle aus base.css)
    STATUS: In Arbeit
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anna Greyhem</title>
  <meta name="description" content="Anna Greyhem — writer, artist, world-builder. Literature you don't just read. You enter it.">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Anna Greyhem">
  <meta property="og:title" content="Anna Greyhem">
  <meta property="og:description" content="Anna Greyhem — writer, artist, world-builder. Literature you don't just read. You enter it.">
  <meta property="og:url" content="https://annagreyhem.com">
  <meta property="og:image" content="https://annagreyhem.com/assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anna Greyhem">
  <meta name="twitter:description" content="Anna Greyhem — writer, artist, world-builder. Literature you don't just read. You enter it.">
  <meta name="twitter:image" content="https://annagreyhem.com/assets/images/og-image.png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; }

    /* ── Hero — nur beim ersten Besuch ── */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: min-height 0.6s ease, opacity 0.6s ease;
    }

    #hero.collapsed {
      min-height: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    #logo-hero {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-style: normal;
      letter-spacing: 0.18em;
      color: #ffffff;
      white-space: nowrap;
      font-size: clamp(32px, 7vw, 64px);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* ── Fixierter Header ──
       FIX: padding-top berücksichtigt jetzt die iOS Safe Area (Notch/Statusleiste).
       env(safe-area-inset-top) = 0 auf normalen Geräten, ~44-59px auf iPhone mit Notch/Dynamic Island.
       Das background-Gradient wird dadurch auch länger und füllt den ganzen Bereich.
    ── */
    #logo-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;

      /* Safe Area + normales Padding oben */
      padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
      padding-bottom: 44px;
      padding-left: 80px;
      padding-right: 80px;

      pointer-events: none;

      /* Gradient verlängert sich dynamisch je nach Safe Area */
      background: linear-gradient(to bottom, #0a0a0a 0%, #0a0a0a 55%, rgba(10,10,10,0.92) 80%, transparent 100%);

      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--text);
      font-size: clamp(15px, 2vw, 20px);
      white-space: nowrap;

      /* FIX: Übergang über opacity — weich auf allen Geräten */
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #logo-header.visible { opacity: 1; }

    /* ── Menü Button ──
       FIX: top berücksichtigt jetzt ebenfalls die Safe Area
    ── */
    #menu-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 20px);
      left: 40px;
      z-index: 200;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text);
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    #menu-btn:hover span { opacity: 1; }
    #menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); opacity: 1; }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); opacity: 1; }

    /* ── Menü Overlay ── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(40px, 10vw, 120px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu-overlay.open { opacity: 1; pointer-events: all; }

    .menu-item {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--text-soft);
      text-decoration: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
      transition: color 0.3s ease;
      display: block;
    }

    .menu-item:hover { color: var(--text); }

    .menu-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    /* ── Gedicht ── */
    #poem-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      padding: 60px clamp(28px, 8vw, 64px) 80px;
      max-width: 600px;
      margin: 0 auto;
    }

    #poem-wrap {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #poem-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-stanza {
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 2.1;
      font-weight: 400;
      text-align: left;
    }

    /* ── Nacht: Korrektur ── */
    .night-correction-wrap {
      position: relative;
      display: inline;
    }

    .bedtime-struck {
      position: relative;
      display: inline-block;
      color: var(--text);
    }

    .bedtime-struck::after {
      content: '';
      position: absolute;
      left: 6%; right: -3%;
      top: 52%;
      height: 1px;
      background: #6b1a1a;
      transform: rotate(-0.8deg);
    }

    .alice-replacement {
      position: absolute;
      bottom: 85%; left: 0;
      color: var(--alice);
      font-style: italic;
      font-size: 0.88em;
      white-space: nowrap;
      pointer-events: none;
      line-height: 1;
    }

    /* ── Buchinhalt ── */
    #book-section {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 1s ease, transform 1s ease;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: clamp(60px, 10vh, 100px) clamp(28px, 8vw, 64px) clamp(100px, 14vh, 140px);
      max-width: 900px;
      margin: 0 auto;
    }

    .book-layout {
      display: flex;
      gap: clamp(32px, 6vw, 80px);
      align-items: flex-start;
    }

    .book-cover {
      flex: 0 0 auto;
      width: clamp(140px, 28vw, 240px);
    }

    .cover-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.25em;
      font-style: italic;
    }

    .book-info {
      flex: 1;
      padding-top: 4px;
    }

    .book-title {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 400;
      margin-bottom: clamp(24px, 4vh, 40px);
    }

    .book-title span {
      display: block;
      font-size: clamp(12px, 1.4vw, 14px);
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .book-info p {
      font-size: clamp(18px, 2.2vw, 20px);
      line-height: 1.9;
      margin-bottom: 1.4em;
      color: var(--text);
    }

    .book-info em {
      font-style: italic;
      color: rgba(255,255,255,0.6);
    }

    .buy-link {
      display: inline-block;
      margin-top: clamp(28px, 4vh, 48px);
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 3px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .buy-link:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.3);
    }

    /* ── Typewriter Cursor ── */
    .tw-cursor {
      display: inline-block;
      width: 1px;
      height: 0.8em;
      background: rgba(255,255,255,0.5);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 1s steps(1) infinite;
    }

    .tw-cursor.is-night {
      background: var(--alice);
    }

    #book-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .book-layout { flex-direction: column; }
      .book-cover { width: clamp(120px, 50vw, 180px); }
    }
  </style>
</head>
<body>

  <button id="menu-btn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="menu-overlay">
    <a href="/the-book/" class="menu-item">The Book</a>
    <div class="menu-divider"></div>
    <a href="/the-house/" class="menu-item">The House</a>
    <div class="menu-divider"></div>
    <a href="/the-author/" class="menu-item">The Author</a>
  </nav>

  <div id="logo-header"></div>

  <section id="hero">
    <div id="logo-hero"></div>
  </section>

  <section id="poem-section">
    <div id="poem-wrap"></div>
  </section>

  <section id="book-section">
    <div class="book-layout">
      <div class="book-cover">
        <!-- PLATZHALTER: Ersetze durch <img> wenn Buchcover fertig -->

        Enter the house. Find what's waiting.</p>

        <!-- PLATZHALTER: Ersetze href mit echtem Amazon Link -->
        <a href="#" class="buy-link">Buy on Amazon →</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <a href="/">Anna Greyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    /* ── Nacht-Modus ── */
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      const h = new Date().getHours();
      return h >= 2 && h < 3;
    }

    const night = isNight();

    /* ── Session: Haben wir die Animation schon gesehen? ── */
    const heroEl     = document.getElementById('hero');
    const logoHero   = document.getElementById('logo-hero');
    const logoHeader = document.getElementById('logo-header');
    const fullName   = 'Anna Greyhem';
    const SEEN_KEY   = 'ag_intro_seen';

    const alreadySeen = sessionStorage.getItem(SEEN_KEY) === '1';

    if (alreadySeen) {
      /* Kein Hero — direkt Header sichtbar */
      heroEl.classList.add('collapsed');
      logoHeader.textContent = fullName;
      logoHeader.classList.add('visible');
    } else {
      /* Typewriter Animation */
      async function typewriterLogo() {
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        await sleep(600);
        for (let i = 0; i <= fullName.length; i++) {
          const typed = fullName.slice(0, i);
          const cursorClass = night ? 'tw-cursor is-night' : 'tw-cursor';
          logoHero.innerHTML = i < fullName.length
            ? typed + `<span class="${cursorClass}"></span>`
            : typed;
          logoHeader.textContent = typed;
          let delay = 80 + Math.random() * 60;
          if (i === 4) delay = 340;
          await sleep(delay);
        }
      }
      typewriterLogo();
    }

    /* ── Hero kollabiert sobald Gedicht sichtbar wird ── */
    function collapseHero() {
      if (alreadySeen) return;
      heroEl.classList.add('collapsed');
      logoHeader.classList.add('visible');
      sessionStorage.setItem(SEEN_KEY, '1');
    }

    /* ── Header scroll-Logik
       FIX: Statt position-basiertem Sprung wird jetzt ein scroll-Threshold genutzt.
       Auf Desktop: Header erscheint sobald man 40% des Viewports gescrollt hat.
       Auf Mobile: gleicher Threshold — fühlt sich auf beiden Geräten konsistent an.
       requestAnimationFrame verhindert "flackern" auf schnellen Scroll-Events.
    ── */
    let ticking = false;

    function onScroll() {
      if (alreadySeen) return;
      if (!ticking) {
        requestAnimationFrame(function() {
          const scrolled = window.scrollY;
          const threshold = window.innerHeight * 0.4;
          if (scrolled > threshold) {
            logoHeader.classList.add('visible');
          } else {
            logoHeader.classList.remove('visible');
          }
          ticking = false;
        });
        ticking = true;
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });

    /* ── Gedicht befüllen ── */
    const poemWrap = document.getElementById('poem-wrap');

    if (night) {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever<br>
          cannot sleep<br>
          without a
          <span class="night-correction-wrap">
            <span class="alice-replacement">Bad time story</span>
            <span class="bedtime-struck">bedtime story</span>
          </span><br>
          that's scarier<br>
          than their dreams.
        </div>`;
    } else {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever,<br>
          sees the beauty that decays<br>
          and lives a life<br>
          that moans.
        </div>`;
    }

    /* ── Gedicht erscheint + Hero kollabiert ── */
    let poemRevealed = false;

    function revealPoem() {
      if (poemRevealed) return;
      poemRevealed = true;
      poemWrap.classList.add('visible');
      collapseHero();
    }

    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) revealPoem();
      });
    }, { threshold: 0.95 });

    observer.observe(poemWrap);

    function onFirstInteraction() {
      revealPoem();
      document.removeEventListener('click', onFirstInteraction);
      document.removeEventListener('touchstart', onFirstInteraction);
      document.removeEventListener('keydown', onFirstInteraction);
    }

    document.addEventListener('click', onFirstInteraction);
    document.addEventListener('touchstart', onFirstInteraction, { passive: true });
    document.addEventListener('keydown', onFirstInteraction);

    /* ── Buchinhalt erscheint beim Scrollen ── */
    const bookSection = document.getElementById('book-section');

    const bookObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          bookSection.classList.add('visible');
          bookObserver.unobserve(bookSection);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -100px 0px" });

    bookObserver.observe(bookSection);

    /* ── Menü ── */
    const menuBtn     = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menuBtn.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });

    menuOverlay.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menuBtn.classList.remove('open');
        menuOverlay.classList.remove('open');
      });
    });
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
