<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: Autorenwebsite — Startseite
    STATUS: In Arbeit — Platzhalter aktiv
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; }

    /* ── Header ── */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 40px;
      pointer-events: none;
    }

    #logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(18px, 2.5vw, 24px);
      letter-spacing: 0.18em;
      color: var(--text);
      white-space: nowrap;
      min-height: 1.4em;
    }

    #logo .night-a {
      color: var(--alice);
      transition: color 0.8s ease;
    }

    /* ── Menü Button ── */
    #menu-btn {
      position: fixed;
      top: 28px; left: 40px;
      z-index: 200;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: all;
    }

    #menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    #menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    /* ── Menü Overlay ── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(40px, 10vw, 120px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu-overlay.open { opacity: 1; pointer-events: all; }

    .menu-item {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
      transition: color 0.3s ease;
      display: block;
    }

    .menu-item:hover { color: var(--text); }

    .menu-item.placeholder {
      color: var(--text-faint);
      cursor: default;
      font-style: italic;
    }

    .menu-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    /* ── Hero — klein halten damit Gedicht schnell kommt ── */
    #hero {
      min-height: 40vh;
    }

    /* ── Gedicht ── */
    #poem-section {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 clamp(28px, 8vw, 64px) 80px;
      max-width: 600px;
      margin: 0 auto;
    }

    #poem-wrap {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    #poem-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-stanza {
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 2.1;
      font-weight: 400;
    }

    /* ── badtime Korrektur ── */
    .badtime-wrap {
      display: inline;
      position: relative;
    }

    /* Das Wort "badtime" mit rotem Durchstrich */
    .badtime-word {
      position: relative;
      display: inline-block;
      color: var(--alice);
    }

    /* Durchstrich — etwas rechts versetzt, fett */
    .badtime-word::after {
      content: '';
      position: absolute;
      left: 8%;
      right: -4%;
      top: 52%;
      height: 2px;
      background: var(--alice);
      transform: rotate(-1deg);
    }

    /* "a" von Alice darüber — kursiv, rot */
    .alice-correction {
      position: absolute;
      top: -0.85em;
      left: 50%;
      transform: translateX(-50%);
      color: var(--alice);
      font-style: italic;
      font-size: 0.8em;
      pointer-events: none;
    }

    /* ── Books Platzhalter ── */
    #books-section {
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px clamp(28px, 8vw, 64px);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .placeholder-block {
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
      letter-spacing: 0.2em;
      font-style: italic;
    }

    /* ── Typewriter Cursor ── */
    .tw-cursor {
      display: inline-block;
      animation: blink 1s steps(1) infinite;
      color: var(--text-muted);
      margin-left: 1px;
    }
  </style>
</head>
<body>

  <button id="menu-btn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="menu-overlay">
    <a href="/books/" class="menu-item">Books</a>
    <div class="menu-divider"></div>
    <span class="menu-item placeholder">The House</span>
    <div class="menu-divider"></div>
    <span class="menu-item placeholder">Diary</span>
  </nav>

  <header id="site-header">
    <div id="logo"></div>
  </header>

  <section id="hero"></section>

  <section id="poem-section">
    <div id="poem-wrap"></div>
  </section>

  <section id="books-section">
    <div class="placeholder-block">— How Life Feels — coming soon —</div>
  </section>

  <footer class="site-footer">
    <a href="/">annagreyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    /* ── Nacht-Modus ── */
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      const h = new Date().getHours();
      return h >= 2 && h < 3;
    }

    const night = isNight();

    /* ── Logo Typewriter ── */
    const logoEl = document.getElementById('logo');
    const fullName = 'Anna Greyhem';
    // Index 3 = das zweite 'a' in 'Anna'

    function buildLogoHTML(typed) {
      let result = '';
      for (let i = 0; i < typed; i++) {
        if (night && i === 3) {
          result += `<span class="night-a">${fullName[i]}</span>`;
        } else {
          result += fullName[i];
        }
      }
      return result;
    }

    async function typewriterLogo() {
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      await sleep(600);
      for (let i = 0; i <= fullName.length; i++) {
        if (i < fullName.length) {
          logoEl.innerHTML = buildLogoHTML(i) + '<span class="tw-cursor">\u258c</span>';
        } else {
          logoEl.innerHTML = buildLogoHTML(i);
        }
        let delay = 80 + Math.random() * 60;
        if (i === 4) delay = 340; // Pause nach "Anna "
        await sleep(delay);
      }
    }

    typewriterLogo();

    /* ── Gedicht ── */
    const poemWrap = document.getElementById('poem-wrap');

    if (night) {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever<br>
          cannot sleep<br>
          without a <span class="badtime-word">badtime<span class="alice-correction">a</span></span> story<br>
          that's scarier<br>
          than their dreams.
        </div>
      `;
    } else {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever,<br>
          sees the beauty<br>
          that decays and<br>
          lives a life<br>
          that moans.
        </div>
      `;
    }

    /* ── Scroll-Observer für Gedicht ── */
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });

    observer.observe(poemWrap);

    /* ── Menü ── */
    const menuBtn     = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', function() {
      menuBtn.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });

    menuOverlay.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menuBtn.classList.remove('open');
        menuOverlay.classList.remove('open');
      });
    });
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
