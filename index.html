<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: Autorenwebsite — Startseite
    STATUS: In Arbeit — Platzhalter aktiv
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    /* ── Grundlayout ── */
    html {
      scroll-behavior: smooth;
    }

    body {
      overflow-x: hidden;
    }

    /* ── Header — fixiert oben ── */
    #site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 40px;
      pointer-events: none;
    }

    /* ── Logo / Name ── */
    #logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(15px, 2vw, 18px);
      letter-spacing: 0.35em;
      color: var(--text);
      white-space: nowrap;
      min-height: 1.4em;
    }

    #logo .night-a {
      color: var(--alice);
      transition: color 0.8s ease;
    }

    /* ── Menü-Button ── */
    #menu-btn {
      position: fixed;
      top: 32px;
      left: 40px;
      z-index: 200;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: all;
    }

    #menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    #menu-btn.open span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    #menu-btn.open span:nth-child(2) {
      opacity: 0;
    }

    #menu-btn.open span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* ── Menü Overlay ── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(40px, 10vw, 120px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .menu-item {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
      transition: color 0.3s ease;
      display: block;
    }

    .menu-item:hover {
      color: var(--text);
    }

    .menu-item.placeholder {
      color: var(--text-faint);
      cursor: default;
      font-style: italic;
    }

    .menu-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    /* ── Hero — erster Bildschirm ── */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Gedicht-Sektion ── */
    #poem-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px clamp(28px, 8vw, 64px);
    }

    #poem-wrap {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      max-width: 480px;
    }

    #poem-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-stanza {
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 2;
      font-weight: 400;
      text-align: left;
    }

    .poem-stanza .correction {
      position: relative;
      display: inline-block;
    }

    /* Das durchgestrichene 'e' */
    .poem-stanza .correction .original {
      position: relative;
    }

    .poem-stanza .correction .original::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 1px;
      background: var(--alice);
    }

    /* Das 'a' von Alice darüber */
    .poem-stanza .correction .alice-letter {
      position: absolute;
      top: -0.7em;
      left: 50%;
      transform: translateX(-50%);
      color: var(--alice);
      font-size: 0.85em;
      font-style: italic;
    }

    /* ── Books Sektion — Platzhalter ── */
    #books-section {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px clamp(28px, 8vw, 64px);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .placeholder-block {
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
      letter-spacing: 0.2em;
      font-style: italic;
    }

    /* ── Typewriter Cursor ── */
    .tw-cursor {
      display: inline-block;
      animation: blink 1s steps(1) infinite;
      color: var(--text-muted);
      margin-left: 1px;
    }
  </style>
</head>
<body>

  <!-- Menü Button -->
  <button id="menu-btn" aria-label="Menü">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Menü Overlay -->
  <nav id="menu-overlay">
    <a href="/books/" class="menu-item">Books</a>
    <div class="menu-divider"></div>
    <span class="menu-item placeholder">The House</span>
    <div class="menu-divider"></div>
    <span class="menu-item placeholder">Diary</span>
  </nav>

  <!-- Header mit Logo -->
  <header id="site-header">
    <div id="logo"></div>
  </header>

  <!-- Hero -->
  <section id="hero"></section>

  <!-- Gedicht -->
  <section id="poem-section">
    <div id="poem-wrap">
      <!-- wird per JS befüllt je nach Tageszeit -->
    </div>
  </section>

  <!-- Books Platzhalter -->
  <section id="books-section">
    <div class="placeholder-block">
      — How Life Feels — coming soon —
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <a href="/">annagreyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    /* ── Nacht-Modus erkennen ── */
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      const h = new Date().getHours();
      return h >= 2 && h < 3;
    }

    const night = isNight();

    /* ── Logo Typewriter ── */
    const logoEl = document.getElementById('logo');

    function buildLogoHTML(typed) {
      // "Anna Greyhem" — nachts ist das zweite 'a' in Greyhem rot
      const full = 'Anna Greyhem';
      const current = full.slice(0, typed);
      if (!night) return current;

      // Nachts: 'a' in 'Greyhem' (position 6 in 'Greyhem', also 11 in full) rot
      let result = '';
      for (let i = 0; i < current.length; i++) {
        if (night && i === 11) {
          result += `<span class="night-a">${current[i]}</span>`;
        } else {
          result += current[i];
        }
      }
      return result;
    }

    async function typewriterLogo() {
      const full = 'Anna Greyhem';
      const sleep = ms => new Promise(r => setTimeout(r, ms));

      await sleep(600);

      for (let i = 0; i <= full.length; i++) {
        if (i < full.length) {
          logoEl.innerHTML = buildLogoHTML(i) +
            '<span class="tw-cursor">\u258c</span>';
        } else {
          logoEl.innerHTML = buildLogoHTML(i);
        }
        let delay = 80 + Math.random() * 60;
        // Pause nach "Anna " vor "Greyhem"
        if (i === 5) delay = 320;
        await sleep(delay);
      }
    }

    typewriterLogo();

    /* ── Gedicht befüllen ── */
    const poemWrap = document.getElementById('poem-wrap');

    if (night) {
      // Nacht-Version mit "badtime" Korrektur
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever<br>
          cannot sleep<br>
          without a 
          <span class="correction">
            <span class="original">b<span style="position:relative;display:inline-block;">e<span class="alice-letter">a</span></span>dtime</span>
          </span>
           story<br>
          that's scarier<br>
          than their dreams.
        </div>
      `;
    } else {
      // Tag-Version
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          to whomever,<br>
          sees the beauty<br>
          that decays and<br>
          lives a life<br>
          that moans.
        </div>
      `;
    }

    /* ── Gedicht beim Scrollen einblenden ── */
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });

    observer.observe(poemWrap);

    /* ── Menü ── */
    const menuBtn = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', function() {
      menuBtn.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });

    // Menü schließen wenn man auf einen Link klickt
    menuOverlay.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menuBtn.classList.remove('open');
        menuOverlay.classList.remove('open');
      });
    });
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
