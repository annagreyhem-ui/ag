<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: Autorenwebsite — Startseite
    KOMMT VON: —
    FÜHRT ZU: /the-book/, /the-house/, /the-author/
    FARBEN: --text, --alice, --text-muted, --text-faint
    STATUS: In Arbeit

    LOGIK:
    - Header-Name: unsichtbar bis der Hero-Name aus dem Viewport scrollt, dann sichtbar (für immer)
    - Typewriter: nur beim allerersten Besuch (sessionStorage), danach sofort fertig
    - iOS Safe Area: viewport-fit=cover + env(safe-area-inset-top)
    - z-index: Header 9999, alles andere 1 — kein Durchscheinen möglich
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anna Greyhem</title>
  <meta name="description" content="Anna Greyhem — writer, artist, world-builder. Literature you don't just read. You enter it.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Anna Greyhem">
  <meta property="og:title" content="Anna Greyhem">
  <meta property="og:description" content="Anna Greyhem — writer, artist, world-builder. Literature you don't just read. You enter it.">
  <meta property="og:url" content="https://annagreyhem.com">
  <meta property="og:image" content="https://annagreyhem.com/assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anna Greyhem">
  <meta name="twitter:description" content="Anna Greyhem — writer, artist, world-builder. Literature you don't just read. You enter it.">
  <meta name="twitter:image" content="https://annagreyhem.com/assets/images/og-image.png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; }

    /* ════════════════════════════════════════
       HEADER
       Immer da. Immer schwarz. Immer gleich hoch.
       Deckt alles ab was darunter scrollt.
       env(safe-area-inset-top) füllt den Bereich
       hinter Dynamic Island / Notch auf dem iPhone.
    ════════════════════════════════════════ */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      background: #0a0a0a;
      height: calc(env(safe-area-inset-top, 0px) + 60px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 14px;
    }

    /* Name: unsichtbar bis Hero rausscrollt */
    #header-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(15px, 2vw, 20px);
      letter-spacing: 0.18em;
      color: var(--text);
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #header-name.visible {
      opacity: 1;
    }

    /* ════════════════════════════════════════
       MENÜ BUTTON
    ════════════════════════════════════════ */
    #menu-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 18px);
      left: 40px;
      z-index: 9999;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text);
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    #menu-btn:hover span { opacity: 1; }
    #menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); opacity: 1; }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); opacity: 1; }

    /* ════════════════════════════════════════
       MENÜ OVERLAY
    ════════════════════════════════════════ */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 5000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(40px, 10vw, 120px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu-overlay.open { opacity: 1; pointer-events: all; }

    .menu-item {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--text-soft);
      text-decoration: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
      transition: color 0.3s ease;
      display: block;
    }

    .menu-item:hover { color: var(--text); }

    .menu-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    /* ════════════════════════════════════════
       HERO
       Volle Bildschirmhöhe. Name groß und zentriert.
       position: relative + z-index: 1 damit er
       niemals über den Header rutscht.
    ════════════════════════════════════════ */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    #logo-hero {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: #ffffff;
      white-space: nowrap;
      font-size: clamp(32px, 7vw, 64px);
      text-align: center;
    }

    /* ════════════════════════════════════════
       GEDICHT
    ════════════════════════════════════════ */
    #poem-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      padding: 60px clamp(28px, 8vw, 64px) 80px;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    #poem-wrap {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      position: relative;
      z-index: 1;
    }

    #poem-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-stanza {
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 2.1;
      font-weight: 400;
    }

    .bedtime-struck {
      position: relative;
      display: inline-block;
    }

    .bedtime-struck::after {
      content: '';
      position: absolute;
      left: 6%; right: -3%;
      top: 52%;
      height: 1px;
      background: #6b1a1a;
      transform: rotate(-0.8deg);
    }

    .alice-replacement {
      position: absolute;
      bottom: 85%; left: 0;
      color: var(--alice);
      font-style: italic;
      font-size: 0.88em;
      white-space: nowrap;
      pointer-events: none;
      line-height: 1;
    }

    /* ════════════════════════════════════════
       BUCHINHALT
    ════════════════════════════════════════ */
    #book-section {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 1s ease, transform 1s ease;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: clamp(60px, 10vh, 100px) clamp(28px, 8vw, 64px) clamp(100px, 14vh, 140px);
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    #book-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .book-layout {
      display: flex;
      gap: clamp(32px, 6vw, 80px);
      align-items: flex-start;
    }

    .book-cover {
      flex: 0 0 auto;
      width: clamp(140px, 28vw, 240px);
    }

    .cover-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.25em;
      font-style: italic;
    }

    .book-info { flex: 1; padding-top: 4px; }

    .book-title {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 400;
      margin-bottom: clamp(24px, 4vh, 40px);
    }

    .book-title span {
      display: block;
      font-size: clamp(12px, 1.4vw, 14px);
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .book-info p {
      font-size: clamp(18px, 2.2vw, 20px);
      line-height: 1.9;
      margin-bottom: 1.4em;
    }

    .book-info em {
      font-style: italic;
      color: rgba(255,255,255,0.6);
    }

    .buy-link {
      display: inline-block;
      margin-top: clamp(28px, 4vh, 48px);
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 3px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .buy-link:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.3);
    }

    .tw-cursor {
      display: inline-block;
      width: 1px;
      height: 0.8em;
      background: rgba(255,255,255,0.5);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 1s steps(1) infinite;
    }

    .tw-cursor.is-night { background: var(--alice); }

    /* Versionsnummer — zum Prüfen ob neue Version geladen ist */
    #version {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.15);
      z-index: 9999;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .book-layout { flex-direction: column; }
      .book-cover { width: clamp(120px, 50vw, 180px); }
    }
  </style>
</head>
<body>

  <button id="menu-btn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="menu-overlay">
    <a href="/the-book/" class="menu-item">The Book</a>
    <div class="menu-divider"></div>
    <a href="/the-house/" class="menu-item">The House</a>
    <div class="menu-divider"></div>
    <a href="/the-author/" class="menu-item">The Author</a>
  </nav>

  <header id="site-header">
    <a id="header-name" href="/">Anna Greyhem</a>
  </header>

  <section id="hero">
    <div id="logo-hero"></div>
  </section>

  <section id="poem-section">
    <div id="poem-wrap"></div>
  </section>

  <section id="book-section">
    <div class="book-layout">
      <div class="book-cover">
        <div class="cover-placeholder">cover</div>
      </div>
      <div class="book-info">
        <div class="book-title">
          <span>Anna Greyhem</span>
          How Life Feels
        </div>
        <p>A novel. A world. An experience.</p>
        <p>Scan the codes hidden in the margins.
        Enter the house. Find what's waiting.</p>
        <p><em>Part novel. Part game. Part digital world.</em></p>
        <a href="#" class="buy-link">Buy on Amazon →</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <a href="/">Anna Greyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <div id="version">v1</div>

  <script>
    /* ── Nacht-Modus ── */
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      return new Date().getHours() >= 2 && new Date().getHours() < 3;
    }
    const night = isNight();

    const logoHero   = document.getElementById('logo-hero');
    const headerName = document.getElementById('header-name');
    const fullName   = 'Anna Greyhem';
    const SEEN_KEY   = 'ag_intro_seen';

    /* ── Typewriter oder sofort fertig ── */
    if (sessionStorage.getItem(SEEN_KEY) === '1') {
      logoHero.textContent = fullName;
    } else {
      sessionStorage.setItem(SEEN_KEY, '1');
      (async function() {
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        await sleep(600);
        for (let i = 0; i <= fullName.length; i++) {
          const typed = fullName.slice(0, i);
          const cur   = night ? 'tw-cursor is-night' : 'tw-cursor';
          logoHero.innerHTML = i < fullName.length
            ? typed + `<span class="${cur}"></span>`
            : typed;
          let delay = 80 + Math.random() * 60;
          if (i === 4) delay = 340;
          await sleep(delay);
        }
      })();
    }

    /* ── Header-Name: erscheint wenn Hero-Name rausscrollt ──
       IntersectionObserver beobachtet #logo-hero.
       Sobald er nicht mehr sichtbar ist → header-name einblenden.
       Einmal eingeblendet: bleibt (observer wird getrennt).
    ── */
    const heroObserver = new IntersectionObserver(function(entries) {
      if (!entries[0].isIntersecting) {
        headerName.classList.add('visible');
        heroObserver.disconnect(); /* einmal sichtbar — nie wieder ausblenden */
      }
    }, {
      threshold: 0,
      rootMargin: '-60px 0px 0px 0px' /* Offset = Header-Höhe */
    });

    heroObserver.observe(logoHero);

    /* ── Gedicht befüllen ── */
    const poemWrap = document.getElementById('poem-wrap');

    if (night) {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever<br>
          cannot sleep<br>
          without a
          <span style="position:relative; display:inline-block;">
            <span class="alice-replacement">Bad time story</span>
            <span class="bedtime-struck">bedtime story</span>
          </span><br>
          that's scarier<br>
          than their dreams.
        </div>`;
    } else {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever,<br>
          sees the beauty that decays<br>
          and lives a life<br>
          that moans.
        </div>`;
    }

    /* ── Gedicht einblenden ── */
    new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        poemWrap.classList.add('visible');
      }
    }, { threshold: 0.3 }).observe(poemWrap);

    /* ── Buchinhalt einblenden ── */
    new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        document.getElementById('book-section').classList.add('visible');
      }
    }, { threshold: 0.1 }).observe(document.getElementById('book-section'));

    /* ── Menü ── */
    const menuBtn     = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menuBtn.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });

    menuOverlay.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menuBtn.classList.remove('open');
        menuOverlay.classList.remove('open');
      });
    });
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
