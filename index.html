<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: Autorenwebsite — Startseite

    STRUKTUR:
    - Hero: "Anna Greyhem" erscheint groß zentriert, tippt sich per Typewriter auf
      Beim Scrollen scrollt der Name mit hoch und wird zum fixierten Header
    - Menü: drei Striche oben links, klappt auf
        → Books (/books/)
        → The House (Platzhalter)
        → Diary (Platzhalter)
    - Gedicht: erscheint sofort beim ersten Scrollen oder Klicken
    - Books: Platzhalter
    - Footer: annagreyhem · impressum · datenschutz

    NACHT-MODUS:
    - Aktiv zwischen 2:00 und 3:00 Uhr nachts (Ortszeit des Besuchers)
    - Easter Egg: annagreyhem.com/?night=true aktiviert Nachtmodus jederzeit
    - Nachts: Ann(a) — Index 3 in "Anna Greyhem" — in var(--alice) Rot, font-weight 700
    - Nachts: "bedtime story" durchgestrichen, "Bad time story" kursiv rot direkt drüber
    - Tagsüber: normales Gedicht

    UNTERSEITEN:
    - /books/           — Bücher (in Arbeit)
    - /the-house/       — Platzhalter
    - /diary/           — Platzhalter
    - /impressum/       — Impressum
    - /datenschutz/     — Datenschutz

    FARBEN: --text, --alice, --text-muted, --text-faint (alle aus base.css)
    STATUS: In Arbeit
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; }

    /* ── Hero ── */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Name im Hero — groß, scrollt mit ── */
    #logo-hero {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-style: normal;
      letter-spacing: 0.18em;
      color: #ffffff;
      white-space: nowrap;
      font-size: clamp(32px, 7vw, 64px);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    #logo-hero .night-a {
      color: var(--alice);
      font-weight: 700;
      font-style: normal;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* ── Fixierter Header — erscheint wenn Hero oben raus ist ── */
    #logo-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 80px 44px;
      pointer-events: none;
      background: linear-gradient(to bottom, #0a0a0a 65%, transparent);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.18em;
      color: var(--text);
      font-size: clamp(15px, 2vw, 20px);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #logo-header.visible { opacity: 1; }

    #logo-header .night-a {
      color: var(--alice);
      font-weight: 700;
      font-style: normal;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* ── Menü Button ── */
    #menu-btn {
      position: fixed;
      top: 24px; left: 40px;
      z-index: 200;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text);
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    #menu-btn:hover span { opacity: 1; }
    #menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); opacity: 1; }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); opacity: 1; }

    /* ── Menü Overlay ── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(40px, 10vw, 120px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu-overlay.open { opacity: 1; pointer-events: all; }

    .menu-item {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
      transition: color 0.3s ease;
      display: block;
    }

    .menu-item:hover { color: var(--text); }

    .menu-item.placeholder {
      color: var(--text-faint);
      cursor: default;
      font-style: italic;
    }

    .menu-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    /* ── Gedicht — direkt unter Hero ── */
    #poem-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      padding: 60px clamp(28px, 8vw, 64px) 80px;
      max-width: 600px;
      margin: 0 auto;
    }

    #poem-wrap {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #poem-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-stanza {
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 2.1;
      font-weight: 400;
    }

    /* ── Nacht: Korrektur ── */
    .night-correction-wrap {
      position: relative;
      display: inline;
    }

    /* "bedtime story" durchgestrichen */
    .bedtime-struck {
      position: relative;
      display: inline-block;
      color: rgba(255,255,255,0.35);
    }

    .bedtime-struck::after {
      content: '';
      position: absolute;
      left: 6%;
      right: -3%;
      top: 52%;
      height: 2px;
      background: var(--alice);
      transform: rotate(-0.8deg);
    }

    /* "Bad time story" direkt drüber — kursiv, rot, nah an der Zeile */
    .alice-replacement {
      position: absolute;
      bottom: 85%;
      left: 0;
      color: var(--alice);
      font-style: italic;
      font-size: 0.88em;
      white-space: nowrap;
      pointer-events: none;
      line-height: 1;
    }

    /* ── Books Platzhalter ── */
    #books-section {
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px clamp(28px, 8vw, 64px);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .placeholder-block {
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
      letter-spacing: 0.2em;
      font-style: italic;
    }

    /* ── Typewriter Cursor — klein und dezent ── */
    .tw-cursor {
      display: inline-block;
      width: 1px;
      height: 0.8em;
      background: rgba(255,255,255,0.5);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 1s steps(1) infinite;
    }
  </style>
</head>
<body>

  <button id="menu-btn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="menu-overlay">
    <a href="/books/" class="menu-item">Books</a>
    <div class="menu-divider"></div>
    <span class="menu-item placeholder">The House</span>
    <div class="menu-divider"></div>
    <span class="menu-item placeholder">Diary</span>
  </nav>

  <!-- Fixierter Header — erscheint beim Scrollen -->
  <div id="logo-header"></div>

  <!-- Hero mit großem Namen -->
  <section id="hero">
    <div id="logo-hero"></div>
  </section>

  <!-- Gedicht direkt darunter -->
  <section id="poem-section">
    <div id="poem-wrap"></div>
  </section>

  <section id="books-section">
    <div class="placeholder-block">— How Life Feels — coming soon —</div>
  </section>

  <footer class="site-footer">
    <a href="/">annagreyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    /* ── Nacht-Modus ── */
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      const h = new Date().getHours();
      return h >= 2 && h < 3;
    }

    const night = isNight();

    /* ── Logo HTML bauen ── */
    const fullName = 'Anna Greyhem';

    function buildLogoHTML(typed) {
      let result = '';
      for (let i = 0; i < typed; i++) {
        if (night && i === 3) {
          result += `<span class="night-a">${fullName[i]}</span>`;
        } else {
          result += fullName[i];
        }
      }
      return result;
    }

    const logoHero   = document.getElementById('logo-hero');
    const logoHeader = document.getElementById('logo-header');

    /* ── Typewriter ── */
    async function typewriterLogo() {
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      await sleep(600);
      for (let i = 0; i <= fullName.length; i++) {
        const html = buildLogoHTML(i);
        logoHero.innerHTML = i < fullName.length
          ? html + '<span class="tw-cursor"></span>'
          : html;
        // Header immer synchron halten
        logoHeader.innerHTML = html;
        let delay = 80 + Math.random() * 60;
        if (i === 4) delay = 340;
        await sleep(delay);
      }
    }

    typewriterLogo();

    /* ── Header einblenden wenn Hero oben raus scrollt ── */
    const heroEl = document.getElementById('hero');

    function onScroll() {
      const heroBottom = heroEl.getBoundingClientRect().bottom;
      if (heroBottom < 80) {
        logoHeader.classList.add('visible');
      } else {
        logoHeader.classList.remove('visible');
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });

    /* ── Gedicht befüllen ── */
    const poemWrap = document.getElementById('poem-wrap');

    if (night) {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever<br>
          cannot sleep<br>
          without a
          <span class="night-correction-wrap">
            <span class="alice-replacement">Bad time story</span>
            <span class="bedtime-struck">bedtime story</span>
          </span><br>
          that's scarier<br>
          than their dreams.
        </div>`;
    } else {
      poemWrap.innerHTML = `
        <div class="poem-stanza">
          To whomever,<br>
          sees the beauty that decays<br>
          and lives a life<br>
          that moans.
        </div>`;
    }

    /* ── Gedicht erscheint sofort beim ersten Scrollen oder Klick ── */
    let poemRevealed = false;

    function revealPoem() {
      if (poemRevealed) return;
      poemRevealed = true;
      poemWrap.classList.add('visible');
    }

    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) revealPoem();
      });
    }, { threshold: 0.05 });

    observer.observe(poemWrap);

    function onFirstInteraction() {
      revealPoem();
      document.removeEventListener('click', onFirstInteraction);
      document.removeEventListener('touchstart', onFirstInteraction);
      document.removeEventListener('keydown', onFirstInteraction);
    }

    document.addEventListener('click', onFirstInteraction);
    document.addEventListener('touchstart', onFirstInteraction, { passive: true });
    document.addEventListener('keydown', onFirstInteraction);

    /* ── Menü ── */
    const menuBtn     = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menuBtn.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });

    menuOverlay.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menuBtn.classList.remove('open');
        menuOverlay.classList.remove('open');
      });
    });
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
