<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: The House
    KOMMT VON: Menü
    FÜHRT ZU:
      /the-house/library/
      /the-house/annas-room/
      /the-house/annas-bathroom/
      /the-house/dining-room/
      /the-house/living-room/
      /the-house/sunroom/
      /the-house/kitchen/
      /the-house/the-tree/
      /the-house/the-pond/
      /the-house/the-gate/
    NACHT-MODUS: 2-3 Uhr oder ?night=true → Bild wird gelblich invertiert
    STATUS: In Arbeit — Overlays werden nach Koordinaten-Feinjustierung hinzugefügt
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The House — Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 80px 44px;
      pointer-events: none;
      background: linear-gradient(to bottom, #0a0a0a 60%, transparent);
    }

    #site-header a {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(15px, 2vw, 20px);
      letter-spacing: 0.18em;
      color: var(--text);
      text-decoration: none;
      pointer-events: all;
    }

    #house-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #floorplan {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 80vh;
      width: auto;
      max-width: 80vw;
      object-fit: contain;
      transition: filter 0.5s ease;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

  <header id="site-header">
    <a href="/">Anna Greyhem</a>
  </header>

  <div id="house-wrap">
    <img id="floorplan"
         src="/assets/images/the-house.png"
         alt="The House — floor plan">
  </div>

  <script>
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      const h = new Date().getHours();
      return h >= 2 && h < 3;
    }

    if (isNight()) {
      document.getElementById('floorplan').style.filter = 'invert(1) sepia(0.3) brightness(0.85)';
    }
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
