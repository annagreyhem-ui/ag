<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: The House
    KOMMT VON: Menü
    EINSTIEG:
      1. Text erscheint Absatz für Absatz beim Tippen (Haus-Stimme)
      2. Hold 2200ms vor letztem Satz (Perspektivwechsel)
      3. Letzter Satz in Anna-Rosa kursiv
      4. Außenbild + "tap to enter"
      5. Türflügel öffnen → Floorplan mit Fade
    NACHT-MODUS: 2-3 Uhr oder ?night=true → Floorplan gelblich invertiert
    STATUS: In Arbeit — Raum-Overlays noch ausstehend
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The House — Anna Greyhem</title>
  <meta name="description" content="Enter the world of Anna and Alice. The house is alive. Explore, discover — something may have changed since your last visit.">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html, body { height: 100%; overflow: hidden; }

    /* ── Header ── */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 80px;
      background: linear-gradient(to bottom, #0a0a0a 0%, #0a0a0a 55%, rgba(10,10,10,0.92) 80%, transparent 100%);
      pointer-events: none;
    }

    #site-header a {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(15px, 2vw, 20px);
      letter-spacing: 0.18em;
      color: var(--text);
      text-decoration: none;
      pointer-events: all;
    }

    /* ── Menü Button ── */
    #menu-btn {
      position: fixed;
      top: 24px; left: 40px;
      z-index: 400;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text);
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    #menu-btn:hover span { opacity: 1; }
    #menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); opacity: 1; }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); opacity: 1; }

    /* ── Menü Overlay ── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 350;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(40px, 10vw, 120px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu-overlay.open { opacity: 1; pointer-events: all; }

    .menu-item {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--text-soft);
      text-decoration: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
      transition: color 0.3s ease;
      display: block;
    }

    .menu-item:hover { color: var(--text); }

    .menu-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    /* ── Footer ── */
    .site-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: linear-gradient(to top, #0a0a0a 60%, transparent);
      padding: 32px clamp(28px, 8vw, 64px) 20px;
    }

    /* ════════════════════════════════
       TEXT SCREEN
    ════════════════════════════════ */
    #text-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #text-wrap {
      max-width: 560px;
      width: 88vw;
      padding: clamp(80px, 12vh, 120px) 0 clamp(80px, 12vh, 120px);
    }

    .story-para {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(18px, 2.6vw, 22px);
      line-height: 1.9;
      color: var(--text);
      margin-bottom: 1.4em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .story-para.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Anna's last sentence — rosa kursiv */
    .anna-voice {
      font-style: italic;
      color: var(--anna);
    }

    /* Tap hint */
    #tap-hint {
      position: fixed;
      bottom: clamp(32px, 6vh, 56px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 110;
    }

    #tap-hint.visible { opacity: 1; }

    /* Hold circle */
    #hold-circle {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
      pointer-events: none;
      z-index: 110;
      display: none;
      transform: translate(-50%, -50%);
      transition: none;
    }

    /* ════════════════════════════════
       ENTRANCE SCREEN — Außenansicht
    ════════════════════════════════ */
    #entrance {
      position: fixed;
      inset: 0;
      z-index: 90;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.8s ease;
      cursor: pointer;
    }

    #entrance.visible { opacity: 1; }

    /* Türflügel */
    #door-left, #door-right {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      overflow: hidden;
      transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1);
    }

    #door-left  { left: 0; }
    #door-right { right: 0; }

    #door-left img, #door-right img {
      position: absolute;
      top: 10%; /* nach unten versetzt damit Turm sichtbar */
      width: 200%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    #door-left  img { left: 0; }
    #door-right img { right: 0; }

    #door-left.open  { transform: translateX(-100%); }
    #door-right.open { transform: translateX(100%); }

    /* Tap to enter — unteres Drittel */
    #tap-enter-wrap {
      position: absolute;
      bottom: 20%;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
    }

    #tap-enter-wrap.visible { opacity: 1; }

    #tap-enter {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.4em;
      color: var(--text);
      background: rgba(0,0,0,0.6);
      padding: 10px 28px;
    }

    /* ════════════════════════════════
       FLOORPLAN
    ════════════════════════════════ */
    #house-wrap {
      position: fixed;
      top: 80px;
      bottom: 80px;
      left: 0; right: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 10;
    }

    #house-wrap.visible { opacity: 1; }

    #floorplan {
      max-height: 100%;
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: filter 0.5s ease;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

  <button id="menu-btn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="menu-overlay">
    <a href="/the-book/" class="menu-item">The Book</a>
    <div class="menu-divider"></div>
    <a href="/the-house/" class="menu-item">The House</a>
    <div class="menu-divider"></div>
    <a href="/the-author/" class="menu-item">The Author</a>
  </nav>

  <header id="site-header">
    <a href="/">Anna Greyhem</a>
  </header>

  <!-- Text Screen -->
  <div id="text-screen">
    <div id="text-wrap"></div>
  </div>

  <div id="tap-hint">tap</div>
  <div id="hold-circle"></div>

  <!-- Entrance Screen -->
  <div id="entrance">
    <div id="door-left">
      <img src="/assets/images/thehouseoutside.png" alt="">
    </div>
    <div id="door-right">
      <img src="/assets/images/thehouseoutside.png" alt="">
    </div>
    <div id="tap-enter-wrap">
      <div id="tap-enter">tap to enter</div>
    </div>
  </div>

  <!-- Floorplan -->
  <div id="house-wrap">
    <img id="floorplan"
         src="/assets/images/the-house.png"
         alt="The House — floor plan of Anna and Alice's villa">
  </div>

  <footer class="site-footer">
    <a href="/">Anna Greyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    /* ── Nacht-Modus ── */
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      return new Date().getHours() >= 2 && new Date().getHours() < 3;
    }

    if (isNight()) {
      document.getElementById('floorplan').style.filter = 'invert(1) sepia(0.3) brightness(0.85)';
    }

    /* ── Story Absätze ── */
    const paragraphs = [
      { text: 'The house had always existed. Anna could not think of a time where she wasn\'t wrapped in the crumbly brick walls. It must have always been there. Anna looked at the house.', type: 'normal' },
      { text: 'And the house looked back at Anna. All these years, it loved the little girl running around enjoying the hidden rooms and the staircases that made excellent slides. Anna got older. She touched the house. The bricks were warm.', type: 'normal' },
      { text: 'The house touched her back — her lace underwear, her warm body, the cherry juice on her lips. It fed her cherries, while she became hungry for life.', type: 'normal' },
      { text: 'The House also became hungry. It became hungry for Anna. Their passion grew so deep that one day it swallowed her whole.', type: 'hold' }, // HOLD before next
      { text: 'The house changes. I can feel it.', type: 'anna' }, // Anna's voice — rosa kursiv
    ];

    const HOLD_MS   = 2200;
    const textWrap  = document.getElementById('text-wrap');
    const tapHint   = document.getElementById('tap-hint');
    const holdCircle = document.getElementById('hold-circle');
    const textScreen = document.getElementById('text-screen');
    const entrance  = document.getElementById('entrance');
    const tapEnterWrap = document.getElementById('tap-enter-wrap');
    const doorLeft  = document.getElementById('door-left');
    const doorRight = document.getElementById('door-right');
    const houseWrap = document.getElementById('house-wrap');

    let phase       = 'text'; // 'text' | 'hold' | 'entrance' | 'open'
    let paraIdx     = 0;
    let holdTimer   = null;
    let holdRaf     = null;
    let holdStart   = 0;

    function addParagraph(para) {
      const el = document.createElement('p');
      el.className = 'story-para';
      if (para.type === 'anna') {
        el.innerHTML = '<span class="anna-voice">' + para.text + '</span>';
      } else {
        el.textContent = para.text;
      }
      textWrap.appendChild(el);
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          el.classList.add('visible');
        });
      });
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function showTapHint(text) {
      tapHint.textContent = text || 'tap';
      tapHint.classList.add('visible');
    }

    function hideTapHint() {
      tapHint.classList.remove('visible');
    }

    function advance() {
      if (phase !== 'text') return;

      hideTapHint();

      if (paraIdx < paragraphs.length) {
        const para = paragraphs[paraIdx];

        if (para.type === 'hold') {
          // Zeige diesen Absatz, dann wechsle zu Hold-Phase
          addParagraph(para);
          paraIdx++;
          phase = 'hold';
          setTimeout(function() {
            showTapHint('hold');
            textScreen.removeEventListener('click', onTap);
            textScreen.addEventListener('pointerdown', onHoldStart);
            textScreen.addEventListener('touchstart', onHoldStart, { passive: true });
          }, 600);
        } else {
          addParagraph(para);
          paraIdx++;
          if (paraIdx < paragraphs.length) {
            setTimeout(function() { showTapHint('tap'); }, 400);
          } else {
            // Letzter Absatz — zeige Entrance
            setTimeout(showEntrance, 1200);
          }
        }
      }
    }

    /* ── Hold Mechanik ── */
    function onHoldStart(e) {
      const p = e.touches ? e.touches[0] : e;
      holdCircle.style.cssText = 'display:block; left:' + p.clientX + 'px; top:' + p.clientY + 'px; width:20px; height:20px;';
      holdStart = performance.now();
      const maxR = Math.min(window.innerWidth, window.innerHeight) * 0.8;

      holdRaf = requestAnimationFrame(function tick(now) {
        const progress = Math.min((now - holdStart) / HOLD_MS, 1);
        const size = 20 + (maxR - 20) * progress;
        holdCircle.style.width  = size + 'px';
        holdCircle.style.height = size + 'px';
        if (progress < 1) {
          holdRaf = requestAnimationFrame(tick);
        } else {
          finishHold();
        }
      });

      holdTimer = setTimeout(finishHold, HOLD_MS);
    }

    function cancelHold() {
      clearTimeout(holdTimer);
      cancelAnimationFrame(holdRaf);
      holdCircle.style.display = 'none';
    }

    function finishHold() {
      cancelHold();
      textScreen.removeEventListener('pointerdown', onHoldStart);
      textScreen.removeEventListener('touchstart', onHoldStart);
      ['pointerup','pointercancel','touchend'].forEach(function(ev) {
        textScreen.removeEventListener(ev, cancelHold);
      });
      phase = 'text';
      hideTapHint();
      // Zeige Anna's letzten Satz
      addParagraph(paragraphs[paraIdx]);
      paraIdx++;
      setTimeout(showEntrance, 1400);
    }

    ['pointerup','pointercancel','touchend'].forEach(function(ev) {
      textScreen.addEventListener(ev, cancelHold, { passive: true });
    });

    /* ── Entrance zeigen ── */
    function showEntrance() {
      entrance.classList.add('visible');
      setTimeout(function() {
        tapEnterWrap.classList.add('visible');
      }, 400);
      entrance.addEventListener('click', onEnterTap);
      entrance.addEventListener('touchstart', onEnterTap, { passive: true });
    }

    function onEnterTap() {
      if (phase === 'open') return;
      phase = 'open';
      entrance.removeEventListener('click', onEnterTap);
      entrance.removeEventListener('touchstart', onEnterTap);

      tapEnterWrap.style.opacity = '0';

      setTimeout(function() {
        doorLeft.classList.add('open');
        doorRight.classList.add('open');
      }, 300);

      setTimeout(function() {
        houseWrap.classList.add('visible');
      }, 700);

      setTimeout(function() {
        textScreen.style.display = 'none';
        entrance.style.display   = 'none';
        tapHint.style.display    = 'none';
      }, 1800);
    }

    /* ── Tap Handler ── */
    function onTap() { advance(); }
    textScreen.addEventListener('click', onTap);

    /* ── Start ── */
    setTimeout(function() {
      advance();
    }, 600);

    /* ── Menü ── */
    const menuBtn     = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menuBtn.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });

    menuOverlay.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menuBtn.classList.remove('open');
        menuOverlay.classList.remove('open');
      });
    });
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
