<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    SEITE: The House
    KOMMT VON: Menü
    FÜHRT ZU:
      /the-house/library/
      /the-house/annas-room/
      /the-house/annas-bathroom/
      /the-house/dining-room/
      /the-house/living-room/
      /the-house/sunroom/
      /the-house/kitchen/
      /the-house/the-tree/
      /the-house/the-pond/
      /the-house/the-gate/
    EINSTIEG: Außenansicht mit Overlay-Text → Tap → Türflügel → Floorplan
    NACHT-MODUS: 2-3 Uhr oder ?night=true → Floorplan gelblich invertiert
    STATUS: In Arbeit — Raum-Overlays noch ausstehend
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The House — Anna Greyhem</title>
  <meta name="description" content="Enter the world of Anna and Alice. The house is alive. Explore, discover — something may have changed since your last visit.">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    html, body { height: 100%; overflow: hidden; }

    /* ── Header ── */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 80px;
      background: linear-gradient(to bottom, #0a0a0a 0%, #0a0a0a 55%, rgba(10,10,10,0.92) 80%, transparent 100%);
      pointer-events: none;
    }

    #site-header a {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(15px, 2vw, 20px);
      letter-spacing: 0.18em;
      color: var(--text);
      text-decoration: none;
      pointer-events: all;
    }

    /* ── Menü Button ── */
    #menu-btn {
      position: fixed;
      top: 24px; left: 40px;
      z-index: 400;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text);
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    #menu-btn:hover span { opacity: 1; }
    #menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); opacity: 1; }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); opacity: 1; }

    /* ── Menü Overlay ── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 350;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(40px, 10vw, 120px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu-overlay.open { opacity: 1; pointer-events: all; }

    .menu-item {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--text-soft);
      text-decoration: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
      transition: color 0.3s ease;
      display: block;
    }

    .menu-item:hover { color: var(--text); }

    .menu-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    /* ── Footer ── */
    .site-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: linear-gradient(to top, #0a0a0a 60%, transparent);
      padding: 32px clamp(28px, 8vw, 64px) 20px;
    }

    /* ════════════════════════════════
       ENTRANCE SCREEN
    ════════════════════════════════ */
    #entrance {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      cursor: pointer;
    }

    /* Türflügel */
    #door-left, #door-right {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      overflow: hidden;
      transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1);
    }

    #door-left  { left: 0; }
    #door-right { right: 0; }

    #door-left img, #door-right img {
      position: absolute;
      top: 8%;
      width: 200%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    #door-left  img { left: 0; }
    #door-right img { right: 0; }

    #door-left.open  { transform: translateX(-100%); }
    #door-right.open { transform: translateX(100%); }

    /* Dunkler Overlay */
    #entrance-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 22%;
      gap: 20px;
      transition: opacity 0.6s ease;
    }

    /* Atmosphärischer Text */
    #entrance-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(16px, 2.4vw, 22px);
      color: var(--text);
      text-align: center;
      line-height: 1.9;
      max-width: 440px;
      padding: 16px 24px;
      background: rgba(0,0,0,0.55);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1s ease, transform 1s ease;
    }

    #entrance-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Anna's voice */
    #entrance-text .anna-voice {
      display: block;
      margin-top: 0.8em;
      color: var(--anna);
    }

    /* Landscape hint */
    #landscape-hint {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.25);
      opacity: 0;
      transition: opacity 1s ease 0.3s;
    }

    #landscape-hint.visible { opacity: 1; }

    /* Tap to enter */
    #tap-enter {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.4em;
      color: var(--text);
      background: rgba(0,0,0,0.6);
      padding: 10px 28px;
      opacity: 0;
      transition: opacity 1s ease 0.6s;
    }

    #tap-enter.visible { opacity: 1; }

    /* ════════════════════════════════
       FLOORPLAN
    ════════════════════════════════ */
    #house-wrap {
      position: fixed;
      top: 80px;
      bottom: 80px;
      left: 0; right: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 10;
    }

    #house-wrap.visible { opacity: 1; }

    #floorplan {
      max-height: 100%;
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: filter 0.5s ease;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

  <button id="menu-btn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="menu-overlay">
    <a href="/the-book/" class="menu-item">The Book</a>
    <div class="menu-divider"></div>
    <a href="/the-house/" class="menu-item">The House</a>
    <div class="menu-divider"></div>
    <a href="/the-author/" class="menu-item">The Author</a>
  </nav>

  <header id="site-header">
    <a href="/">Anna Greyhem</a>
  </header>

  <!-- Entrance -->
  <div id="entrance">
    <div id="door-left">
      <img src="/assets/images/thehouseoutside.png" alt="">
    </div>
    <div id="door-right">
      <img src="/assets/images/thehouseoutside.png" alt="">
    </div>
    <div id="entrance-overlay">
      <div id="entrance-text">
        This house swallowed me.<br>
        It changes.<br>
        <span class="anna-voice">I can feel it.</span>
      </div>
      <div id="landscape-hint">best experienced sideways</div>
      <div id="tap-enter">tap to enter</div>
    </div>
  </div>

  <!-- Floorplan -->
  <div id="house-wrap">
    <img id="floorplan"
         src="/assets/images/the-house.png"
         alt="The House — floor plan of Anna and Alice's villa">
  </div>

  <footer class="site-footer">
    <a href="/">Anna Greyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    /* ── Nacht-Modus ── */
    function isNight() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('night') === 'true') return true;
      return new Date().getHours() >= 2 && new Date().getHours() < 3;
    }

    if (isNight()) {
      document.getElementById('floorplan').style.filter = 'invert(1) sepia(0.3) brightness(0.85)';
    }

    /* ── Text einblenden ── */
    setTimeout(function() {
      document.getElementById('entrance-text').classList.add('visible');
      document.getElementById('landscape-hint').classList.add('visible');
      document.getElementById('tap-enter').classList.add('visible');
    }, 700);

    /* ── Tap to enter ── */
    const entrance    = document.getElementById('entrance');
    const doorLeft    = document.getElementById('door-left');
    const doorRight   = document.getElementById('door-right');
    const overlay     = document.getElementById('entrance-overlay');
    const houseWrap   = document.getElementById('house-wrap');
    let entered = false;

    function enter() {
      if (entered) return;
      entered = true;
      entrance.removeEventListener('click', enter);
      entrance.removeEventListener('touchstart', enter);

      overlay.style.opacity = '0';

      setTimeout(function() {
        doorLeft.classList.add('open');
        doorRight.classList.add('open');
      }, 400);

      setTimeout(function() {
        houseWrap.classList.add('visible');
      }, 800);

      setTimeout(function() {
        entrance.style.display = 'none';
      }, 1800);
    }

    entrance.addEventListener('click', enter);
    entrance.addEventListener('touchstart', enter, { passive: true });

    /* ── Menü ── */
    const menuBtn     = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menuBtn.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });

    menuOverlay.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menuBtn.classList.remove('open');
        menuOverlay.classList.remove('open');
      });
    });
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <footer style="
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px;
  text-align: center;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 14px;
  color: rgba(255,255,255,0.55);
  background: transparent;
  z-index: 100;
">
  <a href="/" style="color: rgba(255,255,255,0.55); text-decoration: none;">annagreyhem</a>
  &nbsp;·&nbsp;
  <a href="/impressum/" style="color: rgba(255,255,255,0.55); text-decoration: none;">impressum</a>
  &nbsp;·&nbsp;
  <a href="/datenschutz/" style="color: rgba(255,255,255,0.55); text-decoration: none;">datenschutz</a>
</footer>
</body>
</html>
