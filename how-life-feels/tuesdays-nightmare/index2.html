<!DOCTYPE html>
<html lang="de">
<head>
  <!--
  DATEI: index.html
  ERLEBNIS: tuesdays-nightmare
  BUCH-SEITE:
  KOMMT VON: QR-Code
  FÜHRT ZU:
  FARBEN: nachtblau / messing / blut
  STATUS: In Arbeit
-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tuesday's Nightmare — Anna Greyhem</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{
      --serif:'Cormorant Garamond', Georgia, serif;
      --mono:ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
      --ink:rgba(233,238,247,0.85);
      /* bone = warm off-white legal-footer palette */
      --bone:#ece3d0;
      --bone-2:rgba(236,227,208,0.88);
      --bone-3:rgba(236,227,208,0.55);
      --bone-4:rgba(236,227,208,0.30);
      --cherry-3:#8a2b22;
      --ease:cubic-bezier(.4,0,.2,1);
      --ar:0.5628;            /* exact aspect ratio of the room photos (941/1672) */
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      background:#04050a;
      color:var(--ink);
      font-family:var(--serif);
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none;user-select:none;
      cursor:default;
    }

    /* ---------- STAGE ----------
       The stage keeps the photo's exact aspect ratio, so a percentage position
       inside it lands on the same spot of the photo on every screen. On phones
       it fills the height and is anchored left (so the wall switch is never
       cropped off); on wider screens it is a centred portrait column. */
    #stage{
      position:fixed;
      top:0;
      height:100dvh;
      width:calc(100dvh * var(--ar));
      left:0;
      overflow:hidden;
      background:#04050a;
    }
    @media (min-aspect-ratio: 563/1000){
      #stage{ left:50%; transform:translateX(-50%); }
    }

    .layer{
      position:absolute;
      inset:0;
      background-position:center center;
      background-repeat:no-repeat;
      background-size:cover;
      will-change:opacity;
    }
    /* bottom → top : dark room, the blood message, the warm light */
    #layerDark{ background-image:url("https://cdn.annagreyhem.com/how-life-feels/room-dark.jpg"); opacity:0; transition:opacity 0.4s ease; }
    #layerMsg{
      background-image:url("https://cdn.annagreyhem.com/how-life-feels/room-message.jpg");
      opacity:0;
      transition:opacity 2.6s linear;
    }
    #layerLit{
      background-image:url("https://cdn.annagreyhem.com/how-life-feels/room-lit.jpg");
      opacity:0;
      transition:opacity 1.6s cubic-bezier(.4,0,.2,1);
    }

    #vignette{
      position:absolute;inset:0;
      pointer-events:none;
      background:radial-gradient(125% 95% at 50% 42%, rgba(0,0,0,0) 42%, rgba(2,4,10,0.5) 100%);
      mix-blend-mode:multiply;
      z-index:5;
    }
    #grain{
      position:absolute;inset:-50%;
      z-index:7;pointer-events:none;
      opacity:.045;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      animation:grain 1.2s steps(3) infinite;
    }
    @keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-6px,4px)}66%{transform:translate(5px,-5px)}100%{transform:translate(0,0)}}

    /* ---------- LIGHT SWITCH (sits exactly over the painted one) ---------- */
    #switch{
      position:absolute;
      left:93.0%;
      top:39.6%;
      width:26px;
      height:34px;
      transform:translate(-50%,-50%);
      cursor:pointer;
      z-index:8;
      touch-action:manipulation;
    }
    /* A small white wall light switch — plate + rocker — so it looks like it
       could really be part of the photographed room. */
    .plate{
      position:absolute;left:50%;top:50%;
      width:19px;height:29px;
      transform:translate(-50%,-50%);
      border-radius:3px;
      background:linear-gradient(150deg, #e3dbc9 0%, #cdc4ad 60%, #b6ac94 100%);
      box-shadow:
        0 1px 3px rgba(0,0,0,.55),
        inset 0 1px 1px rgba(255,250,238,.55),
        inset 0 -1px 2px rgba(40,30,15,.22);
      border:1px solid rgba(35,26,12,.30);
    }
    .rocker{
      position:absolute;left:50%;top:50%;
      width:11px;height:21px;
      transform:translate(-50%,-50%);
      border-radius:2px;
      /* OFF: lower half catches a touch of shadow (pressed down) */
      background:linear-gradient(180deg,#ece3d0 0%,#ddd3bd 46%,#c2b8a0 52%,#b2a88f 100%);
      box-shadow:inset 0 1px 1px rgba(255,250,238,.6), inset 0 -2px 3px rgba(40,30,15,.26);
      border:1px solid rgba(35,26,12,.20);
      transition:background .18s ease, box-shadow .18s ease;
    }
    /* light ON: rocker pressed the other way (top recessed) */
    #switch.on .rocker{
      background:linear-gradient(180deg,#b2a88f 0%,#c2b8a0 48%,#ddd3bd 54%,#ece3d0 100%);
      box-shadow:inset 0 2px 3px rgba(40,30,15,.26), inset 0 -1px 1px rgba(255,250,238,.6);
    }
    /* a soft breathing glow + a ring that stays visible the whole time, so the
       player always knows the switch can (and should) be tapped repeatedly */
    .glow{
      position:absolute;left:50%;top:50%;
      width:18px;height:26px;
      transform:translate(-50%,-50%);
      border-radius:4px;
      background:radial-gradient(closest-side, rgba(235,222,195,.26), rgba(235,222,195,0));
      filter:blur(3px);
      animation:glow 3.4s ease-in-out infinite;
    }
    .halo{
      position:absolute;left:50%;top:50%;
      width:24px;height:24px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      border:1px solid rgba(235,222,195,.34);
      animation:halo 3s ease-out infinite;
    }
    @keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}
    @keyframes halo{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
      28%{opacity:.5}
      100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}
    }


    /* ===================== FOOT SCRIM =====================
       The legal line must stay legible even when a scene runs imagery
       or light colour to the bottom edge. A fixed scrim darkens the foot
       of every page back to ink. Kept SEPARATE from .qr-legal so it never
       fades with the line — it is always fully present; over the pure-ink
       opening screen it is simply invisible. */
    body::after {
      content: "";
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 150px;
      background: linear-gradient(to top,
                  #04050a 14%,
                  rgba(10,10,12,0.82) 40%,
                  transparent 100%);
      pointer-events: none;
      z-index: 75;            /* above grain, below .qr-legal (80) */
    }

    /* ============ STILLE RECHTLICHE FUSSZEILE ============
       Dauerhaft präsent. Standardmäßig so blass, dass sie im
       Dunkel verschwindet; wird hell, sobald der Leser sich nähert
       (Hover / Fokus / Touch). Kompakt + zentriert, damit sie nie
       die Taps abfängt, die die interaktiven Szenen steuern. */
    .qr-legal {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 80;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      opacity: 0.26;                          /* fast unsichtbar */
      transition: opacity 0.7s var(--ease);
    }
    .qr-legal:hover,
    .qr-legal:focus-within,
    .qr-legal[data-near="true"] { opacity: 1; }  /* erwacht bei Annäherung */

    .qr-legal .mark {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--bone-2);
      text-decoration: none;
    }
    .qr-legal .mark em { font-style: italic; }

    .qr-legal a:not(.mark) {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--bone-3);
      text-decoration: none;
      min-height: 36px;                       /* Touch-Ziel */
      display: inline-flex;
      align-items: center;
      transition: color 0.4s ease;
    }
    .qr-legal a:not(.mark):hover { color: var(--bone); }
    .qr-legal a:focus-visible { outline: 1px solid var(--cherry-3); outline-offset: 3px; }
    .qr-legal .sep { color: var(--bone-4); font-size: 10px; }

    @media (prefers-reduced-motion: reduce){
      #grain,.halo,.glow{animation:none}
    }
  </style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#05070c">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#05070c"/>
      <!-- light switch plate -->
      <rect x="545" y="330" width="110" height="170" rx="10" fill="#141821" stroke="#2a303c" stroke-width="3"/>
      <rect x="580" y="360" width="40" height="80" rx="6" fill="#e9eef7"/>
      <rect x="580" y="360" width="40" height="40" rx="6" fill="#c8cfdb"/>
      <!-- faint glow -->
      <circle cx="600" cy="400" r="150" fill="#e9eef7" opacity="0.05"/>
    </svg>
  </template>
  <div id="stage">
    <div class="layer" id="layerDark"></div>
    <div class="layer" id="layerMsg"></div>
    <div class="layer" id="layerLit"></div>
    <div id="vignette"></div>
    <div id="grain"></div>

    <!-- the wall light switch -->
    <div id="switch" aria-label="Lichtschalter" role="button" tabindex="0">
      <div class="glow"></div>
      <div class="plate"></div>
      <div class="rocker"></div>
      <div class="halo"></div>
    </div>
  </div>

  <nav class="qr-legal" aria-label="Rechtliches" data-near="false">
    <a class="mark" href="https://annagreyhem.com/">Anna <em>Greyhem</em></a>
    <span class="sep" aria-hidden="true">·</span>
    <a href="https://annagreyhem.com/impressum/">Impressum</a>
    <span class="sep" aria-hidden="true">·</span>
    <a href="https://annagreyhem.com/datenschutz/">Datenschutz</a>
    <script data-goatcounter="https://annagreyhem.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </nav>

  <script>
  (function(){
    "use strict";

    /* =========================================================
       AUDIO — synthesised ambience + a soft switch click.
       (No sound is triggered when the writing appears.)
       ========================================================= */
    /* Audio: only a crisp switch click confirms the tap. No ambient drone/hum —
       silence carries the dread better and survives phone speakers. */
    var Audio = (function(){
      var ctx=null, master=null, started=false;

      function init(){
        if(started) return;
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.9;
        master.connect(ctx.destination);
        started = true;
      }
      function t(){ return ctx?ctx.currentTime:0; }
      function warm(on){ /* no ambience — intentionally silent */ }

      /* short buffer of white noise, reused for every click */
      var noiseBuf=null;
      function noise(){
        if(noiseBuf) return noiseBuf;
        var len=Math.floor(ctx.sampleRate*0.05);
        noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
        var d=noiseBuf.getChannelData(0);
        for(var i=0;i<len;i++){ d[i]=Math.random()*2-1; }
        return noiseBuf;
      }
      /* one mechanical "tick": a filtered noise burst (the plastic snap) plus a
         tiny resonant body — no musical tone, so it reads as a real switch. */
      function tick(at, level, cut){
        var src=ctx.createBufferSource(); src.buffer=noise();
        var bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=cut; bp.Q.value=1.1;
        var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
        var g=ctx.createGain();
        g.gain.setValueAtTime(0.0001,at);
        g.gain.exponentialRampToValueAtTime(level,at+0.0008);
        g.gain.exponentialRampToValueAtTime(0.0001,at+0.018);
        src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
        src.start(at); src.stop(at+0.05);
      }
      function click(){
        if(!ctx) return; var now=t();
        /* two-part clack: the finger pressing the toggle, then it snapping over */
        tick(now,        0.32, 2600);
        tick(now+0.028,  0.5,  3400);
      }
      function resume(){ if(ctx && ctx.state==='suspended') ctx.resume(); }
      return {init:init, warm:warm, click:click, resume:resume};
    })();

    /* =========================================================
       SCENE — a plain light switch with one secret:
       every SECOND time you switch the light off, the writing
       bleeds onto the wall (silently). Switching the light back
       on clears it and the room is normal again.
       ========================================================= */
    var lit = document.getElementById('layerLit');
    var msg = document.getElementById('layerMsg');
    var dark = document.getElementById('layerDark');
    var sw  = document.getElementById('switch');

    var lightOn  = false;   // room starts dark
    var offCount = 0;       // how many times the light has been switched OFF
    var lock     = false;   // brief debounce so one tap = one toggle

    // pre-decode the (data-URI) backgrounds so switching never flashes black
    window.addEventListener('load', function(){
      ['layerDark','layerMsg','layerLit'].forEach(function(id){
        var bg = getComputedStyle(document.getElementById(id)).backgroundImage;
        var m = bg.match(/url\("(.+)"\)/);
        if(m){ var im=new Image(); im.src=m[1]; if(im.decode){ im.decode().catch(function(){}); } }
      });
    });

    function toggle(){
      if(lock) return;
      lock = true; setTimeout(function(){ lock=false; }, 360);

      Audio.init();
      Audio.resume();
      Audio.click();

      if(!lightOn){
        /* ---- switch ON : warm, normal room, message cleared ---- */
        lightOn = true;
        sw.classList.add('on');
        dark.style.opacity = '1';   /* reveal the room (stays revealed from now on) */
        msg.style.transition = 'opacity 0.9s ease';
        msg.style.opacity = '0';
        lit.style.transition = 'opacity 0.45s cubic-bezier(.4,0,.2,1)';
        lit.style.opacity = '1';
        Audio.warm(true);
      } else {
        /* ---- switch OFF ---- */
        lightOn = false;
        sw.classList.remove('on');
        offCount++;
        lit.style.transition = 'opacity 0.4s ease';
        lit.style.opacity = '0';
        Audio.warm(false);

        if(offCount % 2 === 0){
          /* every second time the light goes out: the writing snaps onto the wall
             instantly (no fade, no sound) the moment it goes dark */
          setTimeout(function(){
            msg.style.transition = 'none';
            msg.style.opacity = '1';
          }, 40);
        }
      }
    }

    sw.addEventListener('click', toggle);
    sw.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }
    });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) Audio.resume(); });

    /* ---- legal footer: wake it when a pointer/touch nears the bottom edge ---- */
    (function(){
      var legal = document.querySelector('.qr-legal');
      if(!legal) return;
      var nearT;
      function near(){
        legal.setAttribute('data-near','true');
        clearTimeout(nearT);
        nearT = setTimeout(function(){ legal.setAttribute('data-near','false'); }, 2600);
      }
      function check(y){ if(y >= window.innerHeight - 120) near(); }
      window.addEventListener('pointermove', function(e){ check(e.clientY); }, {passive:true});
      window.addEventListener('touchstart', function(e){
        if(e.touches && e.touches[0]) check(e.touches[0].clientY);
      }, {passive:true});
    })();
  })();
  </script>
</body>
</html>
