<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodbye Alice — Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    /* ── Typewriter-spezifisch ── */
    #typewriter-text {
      white-space: pre-wrap;
    }

    /* Cursor-Blinken kommt aus base.css @keyframes blink */
    .tw-cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <div id="typewriter-text" class="prose"></div>
  </div>

  <footer class="site-footer">
    <a href="/">annagreyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    const blocks = [
      { text: "Dear reader,",                                                                    sep: "n", prePause: true },
      { text: "So you made it back.",                                                             sep: "n" },
      { text: "I watched you the whole time. Every page.",                                        sep: "l" },
      { text: "You were so close. I could almost touch you.",                                     sep: "l" },
      { text: "But you chose her.",                                                               sep: "n" },
      { text: "I guess",                                                                          sep: "c", pauseAfter: true },
      { text: "you are a moth. You always fly towards the light. Even when it burns.",            sep: "l" },
      { text: "Enjoy being alive. While it lasts.",                                              sep: "l" },
      { text: "I am sad I didn't get to play with you.",                                         sep: "n" },
      { text: "Alice",                                                                            sep: "n" },
      { text: "Oh, and",                                                                          sep: "n", pauseAfter: true },
      { text: "when you meet death, give him a kiss from me.",                                   sep: "c" },
    ];

    const textEl = document.getElementById("typewriter-text");
    let content = "";

    const settings = {
      min: 35,
      max: 75,
      punctPause: 200,
      paraPause: 1100,
      linePause: 200,
      thinkPause: 1300,
      readPause: 700,
      shortPause: 600,
    };

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const rand = (a, b) => Math.random() * (b - a) + a;

    function render() {
      textEl.textContent = content;
      const cursor = document.createElement("span");
      cursor.className = "tw-cursor";
      cursor.textContent = "\u258c";
      textEl.appendChild(cursor);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    async function typeText(str) {
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        content += ch;
        render();
        let delay = rand(settings.min, settings.max);
        if (",.!?\u2026\u2013".includes(ch)) delay += settings.punctPause;
        if (ch === "\n") delay += 100;
        await sleep(delay);
      }
    }

    async function run() {
      render();
      await sleep(settings.thinkPause);

      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];

        if (i > 0) {
          if (block.sep === "n") {
            content += "\n\n";
            render();
            await sleep(settings.readPause + settings.paraPause);
          } else if (block.sep === "l") {
            content += "\n";
            render();
            await sleep(settings.linePause);
          } else if (block.sep === "c") {
            content += " ";
            render();
          }
        }

        if (block.prePause) await sleep(settings.thinkPause);
        await typeText(block.text);
        if (block.pauseAfter) await sleep(settings.shortPause);
      }

      render();
    }

    run();
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
