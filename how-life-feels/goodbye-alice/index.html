<!DOCTYPE html>
<html lang="en">
<head>
  <!--

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodbye Alice — Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    #typewriter-text {
      white-space: pre-wrap;
    }

    .tw-cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
      color: rgba(255, 255, 255, 0.4);
      /* Cursor muss normale Schriftgröße haben, nicht Signaturgröße */
      font-size: 1rem;
      font-style: normal;
      vertical-align: baseline;
    }

    .sig {
      font-style: italic;
      font-size: 1.5em;
      line-height: 1.4;
    }

    /* Footer startet unsichtbar */
    .site-footer {
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .site-footer.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <div id="typewriter-text" class="prose"></div>
  </div>

  <footer class="site-footer" id="footer">
    <a href="/">annagreyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    // Blöcke — sep: "n" = neuer Absatz, "l" = neue Zeile, "c" = gleiche Zeile
    const blocks = [
      { text: "Dear reader,",                                                          sep: "n", prePause: true },
      { text: "So you made it back.",                                                  sep: "n" },
      { text: "I watched you the whole time. Every page.",                             sep: "l" },
      { text: "You were so close. I could almost touch you.",                          sep: "l" },
      { text: "But you chose her.",                                                    sep: "n" },
      { text: "You always choose her.",                                                               sep: "c", pauseAfter: true, pauseDuration: 2200 },
      { text: "But I guess you can't do anything about it. You are a moth. You always fly towards the light. Even when it burns. ", sep: "l" },
      { text: "I could have kept you safe in the dark. So sad I didn't get to play with you.",                                   sep: "l" },
      { text: "Enjoy being alive. While it lasts.",                              sep: "n" },
      { text: "Alice",                                                                 sep: "n", isSignature: true, longPauseAfter: true },
      { text: "Oh, and",                                                               sep: "n", pauseAfter: true, pauseDuration: 800 },
      { text: "when you meet death, give him a kiss from me.",                        sep: "c" },
    ];

    const textEl = document.getElementById("typewriter-text");
    const footer  = document.getElementById("footer");
    let content = "";

    const settings = {
      min: 35,
      max: 75,
      punctPause: 200,
      paraPause: 1100,
      linePause: 200,
      thinkPause: 1300,
      readPause: 700,
      longPause: 3200,
    };

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const rand  = (a, b) => Math.random() * (b - a) + a;

    let sigStart, sigEnd;

    function render() {
      textEl.innerHTML = '';

      if (sigStart !== undefined) {
        // Vor der Unterschrift
        const before = document.createTextNode(content.slice(0, sigStart));
        textEl.appendChild(before);

        // Unterschrift — kursiv, größer
        const sig = document.createElement('span');
        sig.className = 'sig';
        sig.textContent = content.slice(sigStart, sigEnd !== undefined ? sigEnd : content.length);
        textEl.appendChild(sig);

        // Nach der Unterschrift — normale Größe
        if (sigEnd !== undefined && sigEnd < content.length) {
          const after = document.createTextNode(content.slice(sigEnd));
          textEl.appendChild(after);
        }
      } else {
        textEl.textContent = content;
      }

      const cursor = document.createElement("span");
      cursor.className = "tw-cursor";
      cursor.textContent = "\u258c";
      textEl.appendChild(cursor);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    async function typeText(str, isSignature) {
      if (isSignature) sigStart = content.length;
      for (let i = 0; i < str.length; i++) {
        content += str[i];
        render();
        let delay = rand(settings.min, settings.max);
        if (",.!?\u2026\u2013".includes(str[i])) delay += settings.punctPause;
        await sleep(delay);
      }
      if (isSignature) sigEnd = content.length;
    }

    async function run() {
      render();
      await sleep(settings.thinkPause);

      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];

        if (i > 0) {
          if (block.sep === "n") {
            content += "\n\n";
            render();
            await sleep(settings.readPause + settings.paraPause);
          } else if (block.sep === "l") {
            content += "\n";
            render();
            await sleep(settings.linePause);
          } else if (block.sep === "c") {
            content += " ";
            render();
          }
        }

        if (block.prePause) await sleep(settings.thinkPause);
        await typeText(block.text, block.isSignature);

        if (block.longPauseAfter) await sleep(settings.longPause);
        else if (block.pauseAfter) await sleep(block.pauseDuration || 600);
      }

      // Fertig — Cursor entfernen, Footer einblenden
      render();
      const cursor = textEl.querySelector('.tw-cursor');
      if (cursor) cursor.remove();

      await sleep(800);
      footer.classList.add('visible');
    }

    run();
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  position: fixed;

  background: transparent;
  z-index: 100;
">

  &nbsp;·&nbsp;

</footer>
</body>
</html>
