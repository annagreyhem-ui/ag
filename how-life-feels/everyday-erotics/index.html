<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    ERLEBNIS: everyday-erotics
    BUCH-SEITE: 
    KOMMT VON: QR-Code
    FÜHRT ZU: —
    FARBEN: --anna, --alice
    STATUS: In Arbeit
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everyday Erotics — Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    /* ── Layout ── */
    html, body {
      min-height: 100%;
      cursor: none;
    }

    #cursor {
      position: fixed;
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    #cursor::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.35);
    }

    /* ── Titel ── */
    #title {
      font-size: clamp(19px, 2.4vw, 26px);
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.18em;
      margin-bottom: clamp(40px, 6vh, 64px);
      line-height: 1.5;
    }

    #title-ext {
      transition: opacity 0.6s ease, color 0.6s ease;
      opacity: 0;
    }

    /* ── Gedicht ── */
    #poem { list-style: none; }

    #poem li {
      margin-bottom: clamp(20px, 3vh, 32px);
    }

    .base-line { display: block; }

    .ext-line {
      display: block;
      padding-left: 1.4em;
      font-style: italic;
      font-weight: 300;
      min-height: 1.9em;
      transition: opacity 0.5s ease, color 0.5s ease;
      opacity: 0;
    }

    /* ── Slider ── */
    #slider-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: clamp(70px, 12vh, 100px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #slider-hint {
      font-style: normal;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.4em;
      text-align: center;
      transition: opacity 1s ease;
      opacity: 0;
      pointer-events: none;
    }

    #slider-track {
      position: relative;
      width: clamp(200px, 55vw, 340px);
      height: 20px;
      display: flex;
      align-items: center;
      cursor: none;
    }

    #slider-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
    }

    #slider-thumb {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      transform: translateX(-50%);
      left: 50%;
      transition: background 0.2s;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="cursor"></div>

  <div class="page-wrap">
    <div id="title">Everyday erotics<span id="title-ext"></span></div>
    <ul id="poem">
      <li><span class="base-line">Whispers in the dark</span><span class="ext-line" id="e0"></span></li>
      <li><span class="base-line">A kiss in a dream</span><span class="ext-line" id="e1"></span></li>
      <li><span class="base-line">A bubble bath, candlelit</span><span class="ext-line" id="e2"></span></li>
      <li><span class="base-line">Cold water on my face</span><span class="ext-line" id="e3"></span></li>
      <li><span class="base-line">A bottle of Merlot</span><span class="ext-line" id="e4"></span></li>
      <li><span class="base-line">A perfume of vanilla and darkness</span><span class="ext-line" id="e5"></span></li>
      <li><span class="base-line">His scent</span><span class="ext-line" id="e6"></span></li>
      <li><span class="base-line">His eyes on me</span><span class="ext-line" id="e7"></span></li>
      <li><span class="base-line">His touch</span><span class="ext-line" id="e8"></span></li>
      <li><span class="base-line">My touch</span><span class="ext-line" id="e9"></span></li>
    </ul>
  </div>

  <div id="slider-wrap">
    <div id="slider-hint">&larr;&nbsp;&nbsp;&nbsp;&rarr;</div>
    <div id="slider-track">
      <div id="slider-line"></div>
      <div id="slider-thumb"></div>
    </div>
  </div>

  <script>
    /* ── Custom Cursor ── */
    var cur = document.getElementById('cursor');
    document.addEventListener('mousemove', function(e) {
      cur.style.left = e.clientX + 'px';
      cur.style.top  = e.clientY + 'px';
    });
    document.addEventListener('touchstart', function() {
      cur.style.display = 'none';
    }, { once: true, passive: true });

    /* ── Texte ── */
    var ext_alice = [
      '— keep me from sleeping',
      '— he never mentions',
      '— with her',
      '— to bring me back',
      '— still sitting there',
      "— isn't mine",
      '— stays on her',
      '— searching for her',
      '— colder than before',
      "— holds him. I won't let go.",
    ];

    var ext_anna = [
      '— keep me from sleeping',
      '— I never mention',
      '— with her',
      '— to bring me back',
      '— still sitting there',
      "— won't let me forget her",
      '— makes me feel guilty',
      '— naked',
      '— I no longer feel',
      '— makes her moan',
    ];

    var titleExt    = document.getElementById('title-ext');
    var sliderTrack = document.getElementById('slider-track');
    var sliderThumb = document.getElementById('slider-thumb');
    var sliderHint  = document.getElementById('slider-hint');
    var currentVal  = 0;

    function render(val) {
      val = Math.max(-1, Math.min(1, val));
      currentVal = val;
      var pct = (val + 1) / 2 * 100;
      sliderThumb.style.left = pct + '%';

      if (val < 0) {
        var t = -val;
        for (var i = 0; i < 10; i++) {
          var el = document.getElementById('e' + i);
          el.textContent = ext_alice[i];
          el.style.opacity = t;
          el.style.color = 'var(--alice)';
        }
        titleExt.style.opacity = t;
        titleExt.style.color = 'var(--alice)';
        titleExt.textContent = ' // with her';
      } else if (val > 0) {
        var t = val;
        for (var i = 0; i < 10; i++) {
          var el = document.getElementById('e' + i);
          el.textContent = ext_anna[i];
          el.style.opacity = t;
          el.style.color = 'var(--anna)';
        }
        titleExt.style.opacity = t;
        titleExt.style.color = 'var(--anna)';
        titleExt.innerHTML = ' // with her<span style="font-size:0.6em;opacity:0.8;">, yes her</span>';
      } else {
        for (var i = 0; i < 10; i++) {
          document.getElementById('e' + i).style.opacity = 0;
        }
        titleExt.style.opacity = 0;
      }
    }

    function valFromClientX(clientX) {
      var rect = sliderTrack.getBoundingClientRect();
      var pct  = (clientX - rect.left) / rect.width;
      return Math.max(-1, Math.min(1, pct * 2 - 1));
    }

    var dragging = false;
    sliderTrack.addEventListener('mousedown', function(e) {
      dragging = true;
      render(valFromClientX(e.clientX));
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      render(valFromClientX(e.clientX));
    });
    document.addEventListener('mouseup', function() { dragging = false; });
    sliderTrack.addEventListener('touchstart', function(e) {
      dragging = true;
      render(valFromClientX(e.touches[0].clientX));
    }, { passive: true });
    document.addEventListener('touchmove', function(e) {
      if (!dragging) return;
      render(valFromClientX(e.touches[0].clientX));
    }, { passive: true });
    document.addEventListener('touchend', function() { dragging = false; }, { passive: true });

    setTimeout(function() { sliderHint.style.opacity = '1'; }, 1500);
    render(0);
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
