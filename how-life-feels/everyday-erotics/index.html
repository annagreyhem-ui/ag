<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    DATEI: index.html
    ERLEBNIS: everyday-erotics
    BUCH-SEITE: 
    KOMMT VON: QR-Code
    FÜHRT ZU: —
    FARBEN: --anna, --alice
    STATUS: In Arbeit
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everyday Erotics — Anna Greyhem</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    /* ── Genug Abstand nach unten für Slider + Footer ── */
    .page-wrap {
      padding-bottom: 160px;
    }

    /* ── Titel-Erweiterung ── */
    #title-ext {
      transition: opacity 0.6s ease, color 0.6s ease;
      opacity: 0;
    }

    /* ── ext-line startet unsichtbar ── */
    .ext-line {
      opacity: 0;
      transition: opacity 0.5s ease, color 0.5s ease;
    }

    /* ── Slider ── */
    #slider-wrap {
      position: fixed;
      bottom: 44px; /* Platz für den Footer */
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 20px;
      gap: 14px;
      background: linear-gradient(to top, #0a0a0a 60%, transparent);
      padding-top: 60px;
    }

    #slider-hint {
      font-size: 13px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.4em;
      text-align: center;
      transition: opacity 1s ease;
      opacity: 0;
      pointer-events: none;
    }

    #slider-track {
      position: relative;
      width: clamp(200px, 55vw, 340px);
      height: 20px;
      display: flex;
      align-items: center;
      cursor: default;
    }

    #slider-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
    }

    #slider-thumb {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      transform: translateX(-50%);
      left: 50%;
      transition: background 0.2s;
      pointer-events: none;
    }

    /* ── Footer: fest am unteren Rand, unter dem Slider ── */
    .site-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 51;
      padding: 10px 16px;
      text-align: center;
      background: #0a0a0a;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="story-title" id="title">Everyday erotics<span id="title-ext"></span></div>
    <ul class="poem">
      <li>
        <span class="poem-line">Whispers in the dark</span>
        <span class="poem-ext ext-line" id="e0"></span>
      </li>
      <li>
        <span class="poem-line">A kiss in a dream</span>
        <span class="poem-ext ext-line" id="e1"></span>
      </li>
      <li>
        <span class="poem-line">A bubble bath, candlelit</span>
        <span class="poem-ext ext-line" id="e2"></span>
      </li>
      <li>
        <span class="poem-line">Cold water on my face</span>
        <span class="poem-ext ext-line" id="e3"></span>
      </li>
      <li>
        <span class="poem-line">A bottle of Merlot</span>
        <span class="poem-ext ext-line" id="e4"></span>
      </li>
      <li>
        <span class="poem-line">A perfume of vanilla and darkness</span>
        <span class="poem-ext ext-line" id="e5"></span>
      </li>
      <li>
        <span class="poem-line">His scent</span>
        <span class="poem-ext ext-line" id="e6"></span>
      </li>
      <li>
        <span class="poem-line">His eyes on me</span>
        <span class="poem-ext ext-line" id="e7"></span>
      </li>
      <li>
        <span class="poem-line">His touch</span>
        <span class="poem-ext ext-line" id="e8"></span>
      </li>
      <li>
        <span class="poem-line">My touch</span>
        <span class="poem-ext ext-line" id="e9"></span>
      </li>
    </ul>
  </div>

  <div id="slider-wrap">
    <div id="slider-hint">&larr;&nbsp;&nbsp;&nbsp;&rarr;</div>
    <div id="slider-track">
      <div id="slider-line"></div>
      <div id="slider-thumb"></div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="/">Anna Greyhem</a> &nbsp;·&nbsp; <a href="/impressum/">impressum</a> &nbsp;·&nbsp; <a href="/datenschutz/">datenschutz</a>
  </footer>

  <script>
    /* ── Texte ── */
    var ext_alice = [
      '— keep me from sleeping',
      '— he never mentions',
      '— with her',
      '— to bring me back',
      '— still sitting there',
      "— isn't mine",
      '— stays on her',
      '— searching for her',
      '— colder than before',
      "— holds him. I won't let go.",
    ];
    var ext_anna = [
      '— keep me from sleeping',
      '— I never mention',
      '— with her',
      '— to bring me back',
      '— still sitting there',
      "— won't let me forget her",
      '— makes me feel guilty',
      '— naked',
      '— I no longer feel',
      '— makes her moan',
    ];

    var titleExt    = document.getElementById('title-ext');
    var sliderTrack = document.getElementById('slider-track');
    var sliderThumb = document.getElementById('slider-thumb');
    var sliderHint  = document.getElementById('slider-hint');

    function render(val) {
      val = Math.max(-1, Math.min(1, val));
      var pct = (val + 1) / 2 * 100;
      sliderThumb.style.left = pct + '%';

      if (val < 0) {
        var t = -val;
        for (var i = 0; i < 10; i++) {
          var el = document.getElementById('e' + i);
          el.textContent = ext_anna[i];
          el.style.opacity = t;
          el.style.color = 'var(--anna)';
        }
        titleExt.style.opacity = t;
        titleExt.style.color = 'var(--anna)';
        titleExt.textContent = ' with her';
      } else if (val > 0) {
        var t = val;
        for (var i = 0; i < 10; i++) {
          var el = document.getElementById('e' + i);
          el.textContent = ext_alice[i];
          el.style.opacity = t;
          el.style.color = 'var(--alice)';
        }
        titleExt.style.opacity = t;
        titleExt.style.color = 'var(--alice)';
        titleExt.innerHTML = ' with her<span style="font-size:0.6em;opacity:0.8;">, yes her</span>';
      } else {
        for (var i = 0; i < 10; i++) {
          document.getElementById('e' + i).style.opacity = 0;
        }
        titleExt.style.opacity = 0;
      }
    }

    function valFromClientX(clientX) {
      var rect = sliderTrack.getBoundingClientRect();
      var pct  = (clientX - rect.left) / rect.width;
      return Math.max(-1, Math.min(1, pct * 2 - 1));
    }

    var dragging = false;

    sliderTrack.addEventListener('mousedown', function(e) {
      dragging = true;
      render(valFromClientX(e.clientX));
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      render(valFromClientX(e.clientX));
    });
    document.addEventListener('mouseup', function() { dragging = false; });

    sliderTrack.addEventListener('touchstart', function(e) {
      dragging = true;
      render(valFromClientX(e.touches[0].clientX));
    }, { passive: true });
    document.addEventListener('touchmove', function(e) {
      if (!dragging) return;
      render(valFromClientX(e.touches[0].clientX));
    }, { passive: true });
    document.addEventListener('touchend', function() { dragging = false; }, { passive: true });

    setTimeout(function() { sliderHint.style.opacity = '1'; }, 1500);
    render(0);
  </script>

  <script data-goatcounter="https://annagreyhem.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
